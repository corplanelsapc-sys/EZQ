<!DOCTYPE html>
<html>
<head>
    <title>EZ Clicker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background:#111;
            color:white;
            font-family:Arial, sans-serif;
            text-align:center;
            margin:0;
            padding:20px;
        }

        h2 {
            margin:10px 0;
        }

        .windows {
            display:flex;
            justify-content:space-around;
            margin-top:20px;
            flex-wrap:wrap;
        }

        .box {
            background:#222;
            border:2px solid #333;
            border-radius:10px;
            padding:20px;
            width:22%;
            min-width:120px;
            transition:0.2s;
            cursor:pointer;
        }

        .label {
            font-size:20px;
            margin-bottom:10px;
            color:#aaa;
        }

        .value {
            font-size:60px;
            font-weight:bold;
        }

        .active {
            border:4px solid yellow;
            box-shadow:0 0 20px yellow;
        }

        .controls {
            margin-top:30px;
        }

        button {
            font-size:25px;
            padding:15px;
            margin:10px;
            width:40%;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        .next {
            background:red;
            color:white;
        }

        .back {
            background:#555;
            color:white;
        }

        .reset {
            background:#222;
            color:#999;
            width:85%;
            font-size:18px;
        }

        .selected {
            margin-top:20px;
            font-size:22px;
            color:#0f0;
        }

        .toggle {
            margin-top:10px;
            font-size:16px;
        }
    </style>
</head>

<body>

<h2>WINDOW DASHBOARD</h2>

<div class="selected">
    Selected Window: <span id="selectedWin">w3</span>
</div>

<div class="toggle">
    <label>
        <input type="checkbox" id="voiceToggle">
        Enable Voice Announcement
    </label>
</div>

<div class="windows">

    <div class="box" id="box-w3">
        <div class="label">WINDOW 3</div>
        <div class="value" id="w3">0</div>
    </div>

    <div class="box" id="box-w4">
        <div class="label">WINDOW 4</div>
        <div class="value" id="w4">0</div>
    </div>

    <div class="box" id="box-w5">
        <div class="label">WINDOW 5</div>
        <div class="value" id="w5">0</div>
    </div>

    <div class="box" id="box-w6">
        <div class="label">WINDOW 6</div>
        <div class="value" id="w6">0</div>
    </div>

</div>

<div class="controls">

    <button class="next" onclick="change(1)">NEXT (+1)</button>
    <button class="back" onclick="change(-1)">BACK (-1)</button>

    <button class="reset" onclick="resetAll()">RESET ALL TO ZERO</button>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    runTransaction,
    onValue,
    set
} 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBwV2E3x88_DGPu8JV4Za6aZMZrWIOt23o",
    authDomain: "panelco-i-queue-system.firebaseapp.com",
    databaseURL: "https://panelco-i-queue-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "panelco-i-queue-system",
    storageBucket: "panelco-i-queue-system.firebasestorage.app",
    messagingSenderId: "1075037996413",
    appId: "1:1075037996413:web:98dc8a28777d5c7b1a7814"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let selected = "w3";
let lastSpoken = {};

// ===== UI SELECT =====
function updateSelectedUI() {

    document.getElementById("selectedWin").innerText = selected;

    ["w3","w4","w5","w6"].forEach(w => {
        document.getElementById("box-" + w).classList.remove("active");
    });

    document.getElementById("box-" + selected).classList.add("active");
}

updateSelectedUI();

// ===== LIVE LISTENER =====
const queueRef = ref(db, "queues");

onValue(queueRef, (snapshot) => {

    const data = snapshot.val();
    if (!data) return;

    updateBox("w3", data.w3);
    updateBox("w4", data.w4);
    updateBox("w5", data.w5);
    updateBox("w6", data.w6);

});

function updateBox(win, value) {

    const val = value || 0;
    document.getElementById(win).innerText = val;

    // OPTIONAL VOICE
    const voiceEnabled = document.getElementById("voiceToggle").checked;

    if (voiceEnabled && lastSpoken[win] !== val) {

        if (win === selected) {

            const msg = new SpeechSynthesisUtterance(
                "Window " + win.replace("w","") +
                " now serving number " + val
            );

            speechSynthesis.speak(msg);
        }

        lastSpoken[win] = val;
    }
}

// ===== CHANGE VALUE =====
window.change = function(amount) {

    const dbRef = ref(db, "queues/" + selected);

    runTransaction(dbRef, (current) => {
        return (current || 0) + amount;
    });

};

// ===== RESET ALL =====
window.resetAll = function() {

    if(!confirm("Reset all windows to zero?")) return;

    ["w3","w4","w5","w6"].forEach(win => {
        set(ref(db, "queues/" + win), 0);
    });
};

// ===== CLICK TO SELECT WINDOW =====
document.querySelectorAll(".box").forEach(box => {

    box.addEventListener("click", () => {

        selected = box.id.replace("box-", "");
        updateSelectedUI();

    });

});

</script>

</body>
</html>
