<!DOCTYPE html>
<html>
<head>
    <title>Queue Clicker Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background:#111;
            color:white;
            font-family:Arial, sans-serif;
            text-align:center;
            margin:0;
            padding:20px;
        }

        h2 {
            margin:10px 0;
        }

        .windows {
            display:flex;
            justify-content:space-around;
            margin-top:20px;
            flex-wrap:wrap;
        }

        .box {
            background:#222;
            border:2px solid #333;
            border-radius:10px;
            padding:20px;
            width:22%;
            min-width:120px;
            transition:0.2s;
        }

        .label {
            font-size:20px;
            margin-bottom:10px;
            color:#aaa;
        }

        .value {
            font-size:60px;
            font-weight:bold;
        }

        .active {
            border:4px solid yellow;
            box-shadow:0 0 20px yellow;
        }

        .controls {
            margin-top:30px;
        }

        button {
            font-size:30px;
            padding:15px;
            margin:10px;
            width:40%;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        .next {
            background:red;
            color:white;
        }

        .back {
            background:#555;
            color:white;
        }

        .selected {
            margin-top:20px;
            font-size:25px;
            color:#0f0;
        }
    </style>
</head>

<body>

<h2>WINDOW DASHBOARD</h2>

<div class="selected">
    Selected Window: <span id="selectedWin">w3</span>
</div>

<div class="windows">

    <div class="box" id="box-w3">
        <div class="label">WINDOW 3</div>
        <div class="value" id="w3">0</div>
    </div>

    <div class="box" id="box-w4">
        <div class="label">WINDOW 4</div>
        <div class="value" id="w4">0</div>
    </div>

    <div class="box" id="box-w5">
        <div class="label">WINDOW 5</div>
        <div class="value" id="w5">0</div>
    </div>

    <div class="box" id="box-w6">
        <div class="label">WINDOW 6</div>
        <div class="value" id="w6">0</div>
    </div>

</div>

<div class="controls">

    <button class="next" onclick="change(1)">NEXT (+1)</button>
    <button class="back" onclick="change(-1)">BACK (-1)</button>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    runTransaction,
    onValue
} 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBwV2E3x88_DGPu8JV4Za6aZMZrWIOt23o",
    authDomain: "panelco-i-queue-system.firebaseapp.com",
    databaseURL: "https://panelco-i-queue-system-default-rtdb.asia-southeast1.firebasedatabase.app/",
    projectId: "panelco-i-queue-system",
    storageBucket: "panelco-i-queue-system.firebasestorage.app",
    messagingSenderId: "1075037996413",
    appId: "1:1075037996413:web:98dc8a28777d5c7b1a7814"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// default selected window
let selected = "w3";

// show selected window
function updateSelectedUI() {

    document.getElementById("selectedWin").innerText = selected;

    ["w3","w4","w5","w6"].forEach(w => {
        document.getElementById("box-" + w).classList.remove("active");
    });

    document.getElementById("box-" + selected).classList.add("active");
}

updateSelectedUI();

// listen ALL windows at once
const queueRef = ref(db, "queues");

onValue(queueRef, (snapshot) => {

    const data = snapshot.val();
    if (!data) return;

    document.getElementById("w3").innerText = data.w3 || 0;
    document.getElementById("w4").innerText = data.w4 || 0;
    document.getElementById("w5").innerText = data.w5 || 0;
    document.getElementById("w6").innerText = data.w6 || 0;

});

// change value of selected window
window.change = function(amount) {

    const dbRef = ref(db, "queues/" + selected);

    runTransaction(dbRef, (current) => {
        return (current || 0) + amount;
    });

};

// click box to select window
document.querySelectorAll(".box").forEach(box => {

    box.addEventListener("click", () => {

        selected = box.id.replace("box-", "");
        updateSelectedUI();

    });

});

</script>

</body>
</html>
