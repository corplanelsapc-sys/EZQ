<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANELCO I Queue Display</title>

```
<style>
    html, body {
        height: 100%;
        margin: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    h1 {
        font-size: 5vw;
        margin-bottom: 30px;
        letter-spacing: 3px;
    }

    table {
        width: 95%;
        border-collapse: collapse;
        table-layout: fixed;
    }

    .header-cell {
        font-size: 2.5vw;
        font-weight: bold;
        border-bottom: 3px solid red;
        padding-bottom: 20px;
        text-align: center;
    }

    .queue-cell {
        font-size: 16vw;
        font-family: Impact, Arial Black, sans-serif;
        text-align: center;
        padding-top: 20px;
    }
</style>
```

</head>

<body>

```
<h1>NOW SERVING</h1>

<table>
    <tr>
        <td class="header-cell">WINDOW 3</td>
        <td class="header-cell">WINDOW 4</td>
        <td class="header-cell">WINDOW 5</td>
        <td class="header-cell">WINDOW 6</td>
    </tr>

    <tr>
        <td class="queue-cell" id="win3">0</td>
        <td class="queue-cell" id="win4">0</td>
        <td class="queue-cell" id="win5">0</td>
        <td class="queue-cell" id="win6">0</td>
    </tr>
</table>

<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue
    }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBwV2E3x88_DGPu8JV4Za6aZMZrWIOt23o",
        authDomain: "panelco-i-queue-system.firebaseapp.com",
        databaseURL: "https://panelco-i-queue-system-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "panelco-i-queue-system",
        storageBucket: "panelco-i-queue-system.firebasestorage.app",
        messagingSenderId: "1075037996413",
        appId: "1:1075037996413:web:98dc8a28777d5c7b1a7814",
        measurementId: "G-RR5ZWBX0QP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const queueRef = ref(db, "queues");

    onValue(queueRef, (snapshot) => {

        const data = snapshot.val();

        console.log("Firebase data:", data);

        if (!data) return;

        document.getElementById("win3").innerText = data.w3 || "0";
        document.getElementById("win4").innerText = data.w4 || "0";
        document.getElementById("win5").innerText = data.w5 || "0";
        document.getElementById("win6").innerText = data.w6 || "0";

    }, (error) => {

        console.error("Firebase Error:", error);

    });

</script>
```

</body>
</html>
