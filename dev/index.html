<!DOCTYPE html>
<html>
<head>
    <title>QMS Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body{
            background:#111;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .login-box{
            background:#222;
            padding:30px;
            border-radius:10px;
            width:320px;
            text-align:center;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:red;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        #msg{
            margin-top:15px;
            color:#ff8080;
        }
        
    </style>
</head>

<body>

<div class="login-box">

    <h2>PANELCO I QMS</h2>
        <td>(QUEUE MANAGEMENT SYSTEM)</td>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <div id="msg"></div>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBwV2E3x88_DGPu8JV4Za6aZMZrWIOt23o",
    authDomain: "panelco-i-queue-system.firebaseapp.com",
    databaseURL: "https://panelco-i-queue-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "panelco-i-queue-system",
    storageBucket: "panelco-i-queue-system.firebasestorage.app",
    messagingSenderId: "1075037996413",
    appId: "1:1075037996413:web:98dc8a28777d5c7b1a7814"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

// =========================
// WHERE DOES EACH ACCOUNT GO?
//
// The login name is  name@company.com
//
//   operator@panelcoi.com  -> system-admin.html  (companies and branches)
//   admin@<any company>    -> window.html        (windows of that company)
//   a staff account whose role is "kiosk" (made in window.html)
//                          -> customer.html      (the ticket kiosk)
//   anything else          -> employee.html      (named employees made in
//                             window.html, or old branch logins such as
//                             mainoffice@panelcoi.com)
// =========================
const SYSTEM_OPERATOR = "operator@panelcoi.com";

async function pageFor(user) {

    const email = user.email.toLowerCase();

    const name = email.split("@")[0];

    const company = (email.split("@")[1] || "").split(".")[0];

    if (email === SYSTEM_OPERATOR) return "system-admin.html";

    if (name === "admin") return "window.html";

    try {

        // companies/<company>/users/<uid> = the person's own record
        const snap = await get(
            ref(db, `companies/${company}/users/${user.uid}`)
        );

        const record = snap.val();

        if (record && record.role === "kiosk" && record.active !== false) {

            return "customer.html";

        }

    }
    catch (error) {

        console.error(error);

    }

    return "employee.html";
}

// =========================
// REDIRECT ONCE SIGNED IN
// (also runs right after a successful login)
// =========================
// index.html?logout signs out whoever is still logged in on this browser
// (used by the kiosk's hidden sign-out) instead of forwarding them.
const wantsLogout = new URLSearchParams(location.search).has("logout");

onAuthStateChanged(auth, async (user) => {

    if (wantsLogout) {
        if (user) await signOut(auth);
        return;
    }

    if (!user || !user.email) return;

    const email = user.email.toLowerCase();

    const office = email.split("@")[0];

    const company = (email.split("@")[1] || "").split(".")[0];

    localStorage.setItem("office", office);

    localStorage.setItem("company", company);

    window.location.href = await pageFor(user);

});

// =========================
// LOGIN FUNCTION
// =========================
window.login = function() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    document.getElementById("msg").innerText = "";

    signInWithEmailAndPassword(auth, email, password)
    .catch((error) => {
        document.getElementById("msg").innerText =
            "Login failed: " + error.message;
    });
};

// Pressing Enter in the password box also logs in
document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") window.login();
});

</script>

</body>
</html>
