<!DOCTYPE html>
<html>
<head>
    <title>QMS Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body{
            background:#111;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .login-box{
            background:#222;
            padding:30px;
            border-radius:10px;
            width:320px;
            text-align:center;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            background:red;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        #msg{
            margin-top:15px;
            color:#ff8080;
        }
        
    </style>
</head>

<body>

<div class="login-box">

    <h2>PANELCO I QMS</h2>
        <td>(QUEUE MANAGEMENT SYSTEM)</td>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">LOGIN</button>

    <div id="msg"></div>

</div>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyBwV2E3x88_DGPu8JV4Za6aZMZrWIOt23o",
    authDomain: "panelco-i-queue-system.firebaseapp.com",
    databaseURL: "https://panelco-i-queue-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "panelco-i-queue-system",
    storageBucket: "panelco-i-queue-system.firebasestorage.app",
    messagingSenderId: "1075037996413",
    appId: "1:1075037996413:web:98dc8a28777d5c7b1a7814"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// =========================
// AUTO REDIRECT IF LOGGED IN
// =========================
onAuthStateChanged(auth, (user) => {

    if (!user) return;

    const email = user.email.toLowerCase();

    if (email === "admin@panelcoi.com") {

        window.location.href = "window.html";

    } else {

        const office = email.split("@")[0];
        
        localStorage.setItem("office", office);

        window.location.href = "staff2.html";
    }

});

// =========================
// LOGIN FUNCTION
// =========================
window.login = function() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {

        const user = userCredential.user;

        // extract office from email
        const office = user.email.split("@")[0].toLowerCase();

        // VALID OFFICES
        const validOffices = [
            "mainoffice",
            "bani",
            "bolinao",
            "dasol",
            "alaminos"
        ];

        const isAdmin =
            user.email.toLowerCase() === "admin@panelcoi.com";

        if (!validOffices.includes(office) && !isAdmin) {

            document.getElementById("msg").innerText =
                "Invalid office account.";

            return;
        }

        if (!validOffices.includes(office)) {
            document.getElementById("msg").innerText =
                "Invalid office account.";
            return;
        }

        // store office
        localStorage.setItem("office", office);

        // redirect
        if (user.email.toLowerCase() === "admin@panelcoi.com") {

         window.location.href = "window.html";

        } else {

        window.location.href = "staff2.html";

    }
    })
    .catch((error) => {
        document.getElementById("msg").innerText =
            "Login failed: " + error.message;
    });
};

</script>

</body>
</html>
