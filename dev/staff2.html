<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Queue Clicker Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Same fonts as the display page so both screens feel like one system -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap"
    rel="stylesheet"
>

<style>

/* Same palette as display.html */
:root {

    --bg: #0B0F13;
    --bg-lift: #131A21;
    --surface: #161E26;
    --line: #26323C;
    --text: #EAF0F4;
    --muted: #7D8C99;
    --go: #35D57F;
    --go-deep: #0E3D28;
    --danger: #E0533D;

}

* {

    box-sizing: border-box;

}

html,
body {

    margin: 0;
    min-height: 100%;

    background: var(--bg);
    color: var(--text);

    font-family: "Barlow", system-ui, sans-serif;

    -webkit-font-smoothing: antialiased;

}

/* Soft spotlight at the top, behind everything */
body::before {

    content: "";

    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            120% 90% at 50% 0%,
            #1A242E 0%,
            var(--bg) 62%
        );

    z-index: -1;

}


/* =========================================================
   PAGE FRAME
========================================================= */

.app {

    min-height: 100vh;
    min-height: 100dvh;

    max-width: 1100px;
    margin: 0 auto;

    padding: clamp(12px, 2vw, 28px);

    display: flex;
    flex-direction: column;

    gap: 16px;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

}

.eyebrow {

    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.16em;

    color: var(--go);

}

h1 {

    margin: 2px 0 0;

    font-size: clamp(18px, 3vw, 28px);
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.1;

}

.chip {

    flex: 0 0 auto;

    display: inline-flex;
    align-items: baseline;

    gap: 8px;

    padding: 8px 14px;

    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;

    font-weight: 600;
    letter-spacing: 0.04em;

}

.chip-label {

    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;

    color: var(--muted);

}


/* =========================================================
   STATUS PANEL (selected window + voice switch)
========================================================= */

.panel {

    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;

    gap: 12px 24px;

    padding: 14px 18px;

    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;

}

.selected-info {

    display: flex;
    flex-direction: column;

    gap: 2px;

    min-width: 0;

}

.selected-value {

    font-size: clamp(16px, 2.4vw, 22px);
    font-weight: 600;

    color: var(--go);

}

/* Voice toggle styled as a switch.
   The real checkbox (#voiceToggle) is kept, just visually hidden. */
.switch {

    display: inline-flex;
    align-items: center;

    gap: 10px;

    cursor: pointer;

    font-weight: 500;

    user-select: none;

}

.switch input {

    position: absolute;

    opacity: 0;

    width: 1px;
    height: 1px;

}

.track {

    position: relative;

    flex: 0 0 auto;

    width: 44px;
    height: 24px;

    background: var(--bg-lift);
    border: 1px solid var(--line);
    border-radius: 999px;

    transition: background-color .2s ease, border-color .2s ease;

}

.track::after {

    content: "";

    position: absolute;

    top: 2px;
    left: 2px;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    background: var(--muted);

    transition: transform .2s ease, background-color .2s ease;

}

.switch input:checked + .track {

    background: var(--go-deep);
    border-color: var(--go);

}

.switch input:checked + .track::after {

    transform: translateX(20px);

    background: var(--go);

}

.switch input:focus-visible + .track {

    outline: 2px solid var(--go);
    outline-offset: 2px;

}


/* =========================================================
   WINDOWS
========================================================= */

.section-head {

    display: flex;
    align-items: baseline;
    justify-content: space-between;

    gap: 12px;

    margin: 0 2px 10px;

}

.section-title {

    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;

    color: var(--muted);

}

.section-hint {

    font-size: 13px;

    color: var(--muted);

}

/* Cards fill the width automatically, no fixed percentages */
.windows {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(min(100%, 170px), 1fr)
        );

    gap: 12px;

}

/* These class names (box, label, value, active) are created and toggled
   by the script, so they must keep these exact names. */
.box {

    padding: 14px 12px 12px;

    text-align: center;

    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 14px;

    cursor: pointer;

    transition:
        border-color .2s ease,
        background-color .2s ease,
        box-shadow .2s ease;

}

.box:hover {

    border-color: var(--muted);

}

/* Second line of the label (the service name): small, muted, uppercase */
.label {

    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 0.06em;
    text-transform: uppercase;

    color: var(--muted);

}

/* First line of the label ("Window 3"): larger and brighter */
.label::first-line {

    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: none;

    color: var(--text);

}

.value {

    margin-top: 4px;

    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: clamp(52px, 8vw, 76px);
    font-weight: 400;
    line-height: 1;
    font-variant-numeric: tabular-nums;

    color: var(--text);

}

/* Selected window: green, matching the "called" look on the display */
.active {

    border-color: var(--go);

    background:
        linear-gradient(
            180deg,
            var(--go-deep) 0%,
            var(--surface) 80%
        );

    box-shadow:
        0 0 0 1px var(--go),
        0 0 28px -8px rgba(53, 213, 127, .5);

}

.active .value {

    color: var(--go);

}


/* =========================================================
   ACTION DOCK
   Stays at the bottom of the screen so the main buttons are
   always reachable, even with many windows.
========================================================= */

.dock {

    position: sticky;
    bottom: 0;

    margin-top: auto;

    padding:
        14px
        0
        calc(6px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            to top,
            var(--bg) 72%,
            rgba(11, 15, 19, 0)
        );

    display: flex;
    flex-direction: column;

    gap: 10px;

}

.dock-main {

    display: grid;

    grid-template-columns: 1fr 2fr;

    gap: 10px;

}

.dock-util {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 10px;

}

.btn {

    font: inherit;
    font-weight: 600;

    color: var(--text);

    background: var(--bg-lift);

    border: 1px solid var(--line);
    border-radius: 12px;

    cursor: pointer;

    transition:
        border-color .15s ease,
        background-color .15s ease,
        transform .08s ease;

}

.btn:hover {

    border-color: var(--muted);

}

.btn:active {

    transform: scale(0.98);

}

.btn:focus-visible {

    outline: 2px solid var(--go);
    outline-offset: 2px;

}

/* Main NEXT / BACK buttons: big, easy targets */
.btn-main {

    min-height: 76px;

    display: flex;
    align-items: baseline;
    justify-content: center;

    gap: 10px;

    padding: 0 16px;

    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 400;
    letter-spacing: 0.04em;

}

.btn-main small {

    font-family: "Barlow", system-ui, sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0;

    opacity: .7;

}

.btn-next {

    background: var(--go);
    border-color: var(--go);

    color: #06170E;

}

.btn-next:hover {

    border-color: var(--text);

}

.btn-back {

    background: var(--surface);

}

/* Secondary buttons */
.btn-util {

    min-height: 46px;

    padding: 0 10px;

    font-size: 14px;

    color: var(--muted);

}

.btn-util:hover {

    color: var(--text);

}

/* Reset is deliberately quiet until hovered, and kept away from NEXT */
.btn-danger {

    color: var(--danger);

    border-color: rgba(224, 83, 61, .35);

}

.btn-danger:hover {

    color: var(--text);

    background: var(--danger);
    border-color: var(--danger);

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 560px) {

    .topbar {

        align-items: flex-start;

    }

    .btn-main {

        min-height: 68px;

    }

    .dock-util {

        gap: 8px;

    }

    .btn-util {

        font-size: 13px;

        padding: 0 6px;

    }

    .section-hint {

        display: none;

    }

}

@media (prefers-reduced-motion: reduce) {

    * {

        transition: none !important;

    }

}

</style>

</head>

<body>

<div class="app">


<!-- =====================================================
     TOP BAR
====================================================== -->

<header class="topbar">

    <div>

        <div class="eyebrow">
            PANELCO I
        </div>

        <h1>
            Queue Management System
        </h1>

    </div>

    <div class="chip">

        <span class="chip-label">
            Office
        </span>

        <span id="officeName">---</span>

    </div>

</header>


<!-- =====================================================
     STATUS: selected window + voice switch
====================================================== -->

<section class="panel">

    <div class="selected-info">

        <span class="chip-label">
            Now controlling
        </span>

        <span class="selected-value" id="selectedWin">---</span>

    </div>

    <label class="switch">

        <input type="checkbox" id="voiceToggle">

        <span class="track"></span>

        <span>Voice announcement</span>

    </label>

</section>


<!-- =====================================================
     WINDOWS (cards are created by the script)
====================================================== -->

<main>

    <div class="section-head">

        <span class="section-title">
            Windows
        </span>

        <span class="section-hint">
            Tap a window to select it
        </span>

    </div>

    <div class="windows" id="windows"></div>

</main>


<!-- =====================================================
     ACTIONS
====================================================== -->

<footer class="dock">

    <div class="dock-main">

        <button class="btn btn-main btn-back" onclick="change(-1)">
            <span>BACK</span>
            <small>&minus;1</small>
        </button>

        <button class="btn btn-main btn-next" onclick="change(1)">
            <span>NEXT</span>
            <small>+1</small>
        </button>

    </div>

    <div class="dock-util">

        <button class="btn btn-util" onclick="goToDisplay()">
            Open display
        </button>

        <button class="btn btn-util" onclick="logout()">
            Switch account
        </button>

        <button class="btn btn-util btn-danger" onclick="resetAll()">
            Reset all
        </button>

    </div>

</footer>


</div>


<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    runTransaction,
    onValue,
    set
}
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyBwV2E3x88_DGPu8JV4Za6aZMZrWIOt23o",

    authDomain: "panelco-i-queue-system.firebaseapp.com",

    databaseURL:
        "https://panelco-i-queue-system-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "panelco-i-queue-system",

    storageBucket:
        "panelco-i-queue-system.firebasestorage.app",

    messagingSenderId: "1075037996413",

    appId: "1:1075037996413:web:98dc8a28777d5c7b1a7814"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


let office = null;

let selected = null;

let windowData = {};

let queueData = {};


// =========================================================
// CREATE SAFE ROLE KEY
// =========================================================

function getRoleKey(label) {
    return String(label || "")
        .trim()
        .toLowerCase()
        .replace(/[.#$[\]/]/g, "")
        .replace(/\s+/g, "_");
}


// =========================================================
// LOGOUT
// =========================================================

window.logout = function() {

    signOut(auth).then(() => {

        window.location.href = "index.html";

    });

};


// =========================================================
// AUTHENTICATION
// =========================================================

onAuthStateChanged(auth, (user) => {

    if (!user) {

        window.location.href = "index.html";

        return;

    }


    office = user.email
        .split("@")[0]
        .toLowerCase();


    const validOffices = [

        "mainoffice",
        "bani",
        "bolinao",
        "dasol",
        "alaminos",
        "anda",
        "agno",
        "burgos",
        "mabini",
        "infanta"

    ];


    if (!validOffices.includes(office)) {

        alert("Invalid office assignment");

        return;

    }


    document.getElementById("officeName").innerText =
        office.toUpperCase();


    startApp();

});


// =========================================================
// START APPLICATION
// =========================================================

function startApp() {


const windowsRef =
    ref(db, `companies/panelcoi/offices/${office}/windows`);


    const queuesRef =
        ref(db, `companies/panelcoi/offices/${office}/queues`);


    const voiceToggle =
        document.getElementById("voiceToggle");


    set(
        ref(db, "settings/voiceEnabled"),
        voiceToggle.checked
    );


    voiceToggle.addEventListener("change", (e) => {

        set(
            ref(db, "settings/voiceEnabled"),
            e.target.checked
        );

    });


    onValue(
        ref(db, "settings/voiceEnabled"),
        (snap) => {

            voiceToggle.checked =
                snap.val() || false;

        }
    );


    // =====================================================
    // LOAD WINDOWS
    // =====================================================

    onValue(windowsRef, (snap) => {

        windowData = snap.val() || {};

        renderWindows();

    });


    // =====================================================
    // LOAD SHARED SERVICE COUNTERS
    // =====================================================

    onValue(queuesRef, (snap) => {

        queueData = snap.val() || {};

        renderWindows();

    });

}


// =========================================================
// RENDER STAFF WINDOWS
// =========================================================

function renderWindows() {


    const container =
        document.getElementById("windows");


    container.innerHTML = "";


    const windows =
        Object.entries(windowData)
            .sort(
                (a, b) =>
                    (a[1].order || 0) -
                    (b[1].order || 0)
            );


    windows.forEach(([id, win], index) => {

        const roleKey =
            getRoleKey(win.label);

        const value =
            win.queue || 0;

        const windowName =
            Number(win.order) > 0
                ? "Window " + win.order
                : "Window";


        const box =
            document.createElement("div");


        box.className = "box";

        box.id = "box-" + id;


        box.innerHTML = `
            <div class="label">
                ${windowName}<br>
                ${win.label || ""}
            </div>
            <div class="value">
                ${value}
            </div>
        `;


        box.onclick = () => {


            selected = id;


            document.getElementById("selectedWin").innerText =
                windowName + " — " + (win.label || "");


            document.querySelectorAll(".box")
                .forEach(x =>
                    x.classList.remove("active")
                );


            box.classList.add("active");

        };


        container.appendChild(box);


        if (index === 0 && !selected) {

            selected = id;


            document.getElementById("selectedWin").innerText =
            windowName + " — " + (win.label || "");


            box.classList.add("active");

        }


    });

}


// =========================================================
// NEXT / BACK
//
// Shared counter:
// offices/{office}/queues/{roleKey}
//
// Individual display:
// offices/{office}/windows/{windowId}/queue
// =========================================================

window.change = async function(amount) {


    if (!selected) {

        alert("Please select a window.");

        return;

    }


    const win = windowData[selected];


    if (!win) return;


    const roleKey =
        getRoleKey(win.label);


    if (!roleKey) {

        alert("This window has no valid service label.");

        return;

    }


    const queueRef =
        ref(
            db,
            `offices/${office}/queues/${roleKey}`
        );


    try {


        const result =
            await runTransaction(
                queueRef,
                (currentValue) => {

                    return Math.max(
                        0,
                        (currentValue || 0) + amount
                    );

                }
            );


        if (!result.committed) {

            return;

        }


        const newNumber =
            result.snapshot.val() || 0;


        // Store the number currently being displayed
        // by THIS physical window.

        await set(
            ref(
                db,
                `companies/panelcoi/offices/${office}/windows/${selected}/queue`
            ),
            newNumber
        );


    }
    catch (error) {

        console.error(error);

        alert(
            "Unable to update queue: " +
            error.message
        );

    }

};


// =========================================================
// RESET ALL
//
// Reset each shared service counter once.
// Also reset every physical window's displayed number.
// =========================================================

window.resetAll = async function() {


    if (!confirm("Reset all queues?")) {

        return;

    }


    const roles = new Set();


    Object.entries(windowData).forEach(
        ([id, win]) => {

            const roleKey =
                getRoleKey(win.label);


            if (roleKey) {

                roles.add(roleKey);

            }

        }
    );


    const promises = [];


    // Reset shared service counters

    roles.forEach((roleKey) => {

        promises.push(

            set(
                ref(
                    db,
                    `offices/${office}/queues/${roleKey}`
                ),
                0
            )

        );

    });


    // Reset each physical window's current number

    Object.keys(windowData).forEach((id) => {

        promises.push(

            set(
                ref(
                    db,
                    `companies/panelcoi/offices/${office}/windows/${id}/queue`
                ),
                0
            )

        );

    });


    try {

        await Promise.all(promises);

    }
    catch (error) {

        console.error(error);

        alert(
            "Unable to reset queues: " +
            error.message
        );

    }

};


// =========================================================
// GO TO DISPLAY
// =========================================================

window.goToDisplay = function() {

    window.open(
        "display.html?office=" + office,
        "_blank"
    );

};

</script>

</body>

</html>
