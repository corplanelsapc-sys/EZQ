<!DOCTYPE html>
<html>

<head>

<title>Queue Clicker Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding:20px;
}

h2 {
    margin:10px 0;
}

.toggle {
    margin:10px;
    font-size:16px;
}

.windows {
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    margin-top:20px;
    gap:10px;
}

.box {
    background:#222;
    border:2px solid #333;
    border-radius:10px;
    padding:20px;
    width:22%;
    min-width:120px;
    cursor:pointer;
}

.label {
    font-size:20px;
    color:#aaa;
}

.value {
    font-size:60px;
    font-weight:bold;
}

.active {
    border:4px solid yellow;
    box-shadow:0 0 15px yellow;
}

button {
    font-size:25px;
    padding:15px;
    margin:10px;
    width:40%;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.next {
    background:red;
    color:white;
}

.back {
    background:#555;
    color:white;
}

.reset {
    background:#222;
    color:#aaa;
    width:85%;
    font-size:18px;
}

.selected {
    margin-top:10px;
    font-size:20px;
    color:#0f0;
}

</style>

</head>

<body>

<h2>PANELCO I QUEUE MANAGEMENT SYSTEM (QMS)</h2>

<div class="toggle">

    <label>

        <input type="checkbox" id="voiceToggle">

        Enable Voice Announcement

    </label>

</div>

<div class="selected">

    Office:
    <span id="officeName">---</span>

    <br>

    Selected:
    <span id="selectedWin">---</span>

</div>

<div class="windows" id="windows"></div>

<div>

    <button class="next" onclick="change(1)">
        NEXT (+1)
    </button>

    <button class="back" onclick="change(-1)">
        BACK (-1)
    </button>

    <button class="reset" onclick="resetAll()">
        RESET ALL
    </button>

    <button onclick="goToDisplay()">
        GO TO DISPLAY
    </button>

    <button onclick="logout()">
        SWITCH ACCOUNT
    </button>

</div>


<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    runTransaction,
    onValue,
    set
}
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


const firebaseConfig = {

    apiKey: "AIzaSyBwV2E3x88_DGPu8JV4Za6aZMZrWIOt23o",

    authDomain: "panelco-i-queue-system.firebaseapp.com",

    databaseURL:
        "https://panelco-i-queue-system-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "panelco-i-queue-system",

    storageBucket:
        "panelco-i-queue-system.firebasestorage.app",

    messagingSenderId: "1075037996413",

    appId: "1:1075037996413:web:98dc8a28777d5c7b1a7814"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const auth = getAuth(app);


let office = null;

let selected = null;

let windowData = {};

let queueData = {};


// =========================================================
// CREATE SAFE ROLE KEY
// =========================================================

function getRoleKey(label) {
    return String(label || "")
        .trim()
        .toLowerCase()
        .replace(/[.#$[\]/]/g, "")
        .replace(/\s+/g, "_");
}


// =========================================================
// LOGOUT
// =========================================================

window.logout = function() {

    signOut(auth).then(() => {

        window.location.href = "index.html";

    });

};


// =========================================================
// AUTHENTICATION
// =========================================================

onAuthStateChanged(auth, (user) => {

    if (!user) {

        window.location.href = "index.html";

        return;

    }


    office = user.email
        .split("@")[0]
        .toLowerCase();


    const validOffices = [

        "mainoffice",
        "bani",
        "bolinao",
        "dasol",
        "alaminos",
        "anda",
        "agno",
        "burgos",
        "mabini",
        "infanta"

    ];


    if (!validOffices.includes(office)) {

        alert("Invalid office assignment");

        return;

    }


    document.getElementById("officeName").innerText =
        office.toUpperCase();


    startApp();

});


// =========================================================
// START APPLICATION
// =========================================================

function startApp() {


const windowsRef =
    ref(db, `companies/panelcoi/offices/${office}/windows`);


    const queuesRef =
        ref(db, `companies/panelcoi/offices/${office}/queues`);


    const voiceToggle =
        document.getElementById("voiceToggle");


    set(
        ref(db, "settings/voiceEnabled"),
        voiceToggle.checked
    );


    voiceToggle.addEventListener("change", (e) => {

        set(
            ref(db, "settings/voiceEnabled"),
            e.target.checked
        );

    });


    onValue(
        ref(db, "settings/voiceEnabled"),
        (snap) => {

            voiceToggle.checked =
                snap.val() || false;

        }
    );


    // =====================================================
    // LOAD WINDOWS
    // =====================================================

    onValue(windowsRef, (snap) => {

        windowData = snap.val() || {};

        renderWindows();

    });


    // =====================================================
    // LOAD SHARED SERVICE COUNTERS
    // =====================================================

    onValue(queuesRef, (snap) => {

        queueData = snap.val() || {};

        renderWindows();

    });

}


// =========================================================
// RENDER STAFF WINDOWS
// =========================================================

function renderWindows() {


    const container =
        document.getElementById("windows");


    container.innerHTML = "";


    const windows =
        Object.entries(windowData)
            .sort(
                (a, b) =>
                    (a[1].order || 0) -
                    (b[1].order || 0)
            );


    windows.forEach(([id, win], index) => {

        const roleKey =
            getRoleKey(win.label);

        const value =
            win.queue || 0;

        const windowName =
            Number(win.order) > 0
                ? "Window " + win.order
                : "Window";


        const box =
            document.createElement("div");


        box.className = "box";

        box.id = "box-" + id;


        box.innerHTML = `
            <div class="label">
                ${windowName}<br>
                ${win.label || ""}
            </div>
            <div class="value">
                ${value}
            </div>
        `;


        box.onclick = () => {


            selected = id;


            document.getElementById("selectedWin").innerText =
                windowName + " — " + (win.label || "");


            document.querySelectorAll(".box")
                .forEach(x =>
                    x.classList.remove("active")
                );


            box.classList.add("active");

        };


        container.appendChild(box);


        if (index === 0 && !selected) {

            selected = id;


            document.getElementById("selectedWin").innerText =
            windowName + " — " + (win.label || "");


            box.classList.add("active");

        }


    });

}


// =========================================================
// NEXT / BACK
//
// Shared counter:
// offices/{office}/queues/{roleKey}
//
// Individual display:
// offices/{office}/windows/{windowId}/queue
// =========================================================

window.change = async function(amount) {


    if (!selected) {

        alert("Please select a window.");

        return;

    }


    const win = windowData[selected];


    if (!win) return;


    const roleKey =
        getRoleKey(win.label);


    if (!roleKey) {

        alert("This window has no valid service label.");

        return;

    }


    const queueRef =
        ref(
            db,
            `offices/${office}/queues/${roleKey}`
        );


    try {


        const result =
            await runTransaction(
                queueRef,
                (currentValue) => {

                    return Math.max(
                        0,
                        (currentValue || 0) + amount
                    );

                }
            );


        if (!result.committed) {

            return;

        }


        const newNumber =
            result.snapshot.val() || 0;


        // Store the number currently being displayed
        // by THIS physical window.

        await set(
            ref(
                db,
                `companies/panelcoi/offices/${office}/windows/${selected}/queue`
            ),
            newNumber
        );


    }
    catch (error) {

        console.error(error);

        alert(
            "Unable to update queue: " +
            error.message
        );

    }

};


// =========================================================
// RESET ALL
//
// Reset each shared service counter once.
// Also reset every physical window's displayed number.
// =========================================================

window.resetAll = async function() {


    if (!confirm("Reset all queues?")) {

        return;

    }


    const roles = new Set();


    Object.entries(windowData).forEach(
        ([id, win]) => {

            const roleKey =
                getRoleKey(win.label);


            if (roleKey) {

                roles.add(roleKey);

            }

        }
    );


    const promises = [];


    // Reset shared service counters

    roles.forEach((roleKey) => {

        promises.push(

            set(
                ref(
                    db,
                    `offices/${office}/queues/${roleKey}`
                ),
                0
            )

        );

    });


    // Reset each physical window's current number

    Object.keys(windowData).forEach((id) => {

        promises.push(

            set(
                ref(
                    db,
                    `companies/panelcoi/offices/${office}/windows/${id}/queue`
                ),
                0
            )

        );

    });


    try {

        await Promise.all(promises);

    }
    catch (error) {

        console.error(error);

        alert(
            "Unable to reset queues: " +
            error.message
        );

    }

};


// =========================================================
// GO TO DISPLAY
// =========================================================

window.goToDisplay = function() {

    window.open(
        "display.html?office=" + office,
        "_blank"
    );

};

</script>

</body>

</html>
