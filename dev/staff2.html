<!DOCTYPE html>
<html>
<head>
<title>Queue Clicker Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
    padding:20px;
}

h2 { margin:10px 0; }

.toggle {
    margin:10px;
    font-size:16px;
}

.windows {
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    margin-top:20px;
    gap:10px;
}

.box {
    background:#222;
    border:2px solid #333;
    border-radius:10px;
    padding:20px;
    width:22%;
    min-width:120px;
    cursor:pointer;
}

.label {
    font-size:20px;
    color:#aaa;
}

.value {
    font-size:60px;
    font-weight:bold;
}

.active {
    border:4px solid yellow;
    box-shadow:0 0 15px yellow;
}

button {
    font-size:25px;
    padding:15px;
    margin:10px;
    width:40%;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.next { background:red; color:white; }
.back { background:#555; color:white; }

.reset {
    background:#222;
    color:#aaa;
    width:85%;
    font-size:18px;
}

.selected {
    margin-top:10px;
    font-size:20px;
    color:#0f0;
}
</style>
</head>

<body>

<h2>PANELCO I QUEUE MANAGEMENT SYSTEM (QMS)</h2>

<div class="toggle">
    <label>
        <input type="checkbox" id="voiceToggle">
        Enable Voice Announcement
    </label>
</div>

<div class="selected">
    Office: <span id="officeName">---</span><br>
    Selected: <span id="selectedWin">---</span>
</div>

<div class="windows" id="windows"></div>

<div>
    <button class="next" onclick="change(1)">NEXT (+1)</button>
    <button class="back" onclick="change(-1)">BACK (-1)</button>
    <button class="reset" onclick="resetAll()">RESET ALL</button>
    <button onclick="goToDisplay()">GO TO DISPLAY</button>
    <button onclick="logout()">SWITCH ACCOUNT</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, runTransaction, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


window.logout = function () {

    signOut(auth).then(() => {
        window.location.href = "index.html";
    });

};

const firebaseConfig = {
    apiKey: "AIzaSyBwV2E3x88_DGPu8JV4Za6aZMZrWIOt23o",
    authDomain: "panelco-i-queue-system.firebaseapp.com",
    databaseURL: "https://panelco-i-queue-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "panelco-i-queue-system",
    storageBucket: "panelco-i-queue-system.firebasestorage.app",
    messagingSenderId: "1075037996413",
    appId: "1:1075037996413:web:98dc8a28777d5c7b1a7814"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let office = null;
let selected = null;
let windowData = {};

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "index.html";
        return;
    }

    office = user.email.split("@")[0].toLowerCase();

    const validOffices = [
        "mainoffice",
        "bani",
        "bolinao",
        "dasol",
        "alaminos"
    ];

    if (!validOffices.includes(office)) {
        alert("Invalid office assignment");
        return;
    }

    document.getElementById("officeName").innerText = office.toUpperCase();

    startApp();
});

function startApp() {

    const windowsRef = ref(db, `offices/${office}/windows`);

    const voiceToggle = document.getElementById("voiceToggle");

    set(ref(db, "settings/voiceEnabled"), voiceToggle.checked);

    voiceToggle.addEventListener("change", (e) => {
        set(ref(db, "settings/voiceEnabled"), e.target.checked);
    });

    onValue(ref(db, "settings/voiceEnabled"), (snap) => {
        voiceToggle.checked = snap.val() || false;
    });

    onValue(windowsRef, (snap) => {

        windowData = snap.val() || {};

        const container = document.getElementById("windows");
        container.innerHTML = "";

        const windows = Object.entries(windowData)
            .sort((a,b) => (a[1].order || 0) - (b[1].order || 0));

        windows.forEach(([id, win], index) => {

            const box = document.createElement("div");
            box.className = "box";
            box.id = "box-" + id;

            box.innerHTML = `
                <div class="label">${win.label}</div>
                <div class="value">${win.queue || 0}</div>
            `;

            box.onclick = () => {

                selected = id;

                document.getElementById("selectedWin").innerText = win.label;

                document.querySelectorAll(".box")
                    .forEach(x => x.classList.remove("active"));

                box.classList.add("active");
            };

            container.appendChild(box);

            if (index === 0 && !selected) {
                selected = id;
                document.getElementById("selectedWin").innerText = win.label;
                box.classList.add("active");
            }
        });
    });

    window.change = function(amount) {

        if (!selected) return;

        runTransaction(
            ref(db, `offices/${office}/windows/${selected}/queue`),
            (v) => Math.max(0, (v || 0) + amount)
        );
    };

    window.resetAll = function() {

        if (!confirm("Reset all queues?")) return;

        Object.keys(windowData).forEach(id => {
            set(ref(db, `offices/${office}/windows/${id}/queue`), 0);
        });
    };
}

window.goToDisplay = function() {
    window.open("index2.html?office=" + office, "_blank");
};
</script>

</body>
</html>
