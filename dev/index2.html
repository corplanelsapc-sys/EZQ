<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue Display</title>

<style>
html, body {
    height: 100%;
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

h1 {
    font-size: 5vw;
    margin: 0;
}

.subtext {
    font-size: 1.2vw;
    font-style: italic;
    text-align: center;
    margin-top: 10px;
    opacity: 0.8;
}

table {
    width: 95%;
    table-layout: fixed;
    margin-top: 10px;
    border-collapse: collapse;
}

.header-cell {
    font-size: 2vw;
    border-bottom: 3px solid red;
    text-align: center;
    padding: 10px;
}

.queue-cell {
    font-size: 10vw;
    text-align: center;
    font-family: Impact;
    border: 3px solid red;
    padding: 20px;
}

#enableAudioBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 20px;
    padding: 15px;
    background: green;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    z-index: 9999;
}
</style>
</head>

<body>

<h1 id="officeTitle">NOW SERVING</h1>

<table>
    <tr id="headerRow"></tr>
    <tr id="dataRow"></tr>
</table>

<div class="subtext">
    PANELCO I : Making Lives Better
</div>

<button id="enableAudioBtn">ENABLE AUDIO</button>

<script type="module">

// ==========================
// GET OFFICE
// ==========================
const urlParams = new URLSearchParams(window.location.search);
const office = urlParams.get("office") || "mainoffice";

document.title = "Queue Display - " + office;

document.getElementById("officeTitle").innerText =
    office.toUpperCase() + " - NOW SERVING";

// ==========================
// FIREBASE
// ==========================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBwV2E3x88_DGPu8JV4Za6aZMZrWIOt23o",
    authDomain: "panelco-i-queue-system.firebaseapp.com",
    databaseURL: "https://panelco-i-queue-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "panelco-i-queue-system",
    storageBucket: "panelco-i-queue-system.firebasestorage.app",
    messagingSenderId: "1075037996413",
    appId: "1:1075037996413:web:98dc8a28777d5c7b1a7814"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ==========================
// REFERENCES
// ==========================
const windowsRef = ref(db, `offices/${office}/windows`);
const voiceRef = ref(db, "settings/voiceEnabled");

// ==========================
// AUDIO
// ==========================
let voiceEnabled = false;
let audioUnlocked = false;
let firstLoad = true;
let last = {};

const beep = new Audio("beep.mp3");

// ==========================
// ENABLE AUDIO
// ==========================
document.getElementById("enableAudioBtn").addEventListener("click", async () => {
    try {
        await beep.play();
        beep.pause();
        beep.currentTime = 0;

        speechSynthesis.speak(
            new SpeechSynthesisUtterance("Audio enabled")
        );

        audioUnlocked = true;
        document.getElementById("enableAudioBtn").style.display = "none";

    } catch (err) {
        alert("Audio blocked. Try again.");
    }
});

// ==========================
// VOICE SETTING
// ==========================
onValue(voiceRef, (snap) => {
    voiceEnabled = snap.val() === true;
});

// ==========================
// SPEAK
// ==========================
function speak(text) {
    if (!audioUnlocked) return;

    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.rate = 1;
    speechSynthesis.speak(msg);
}

// ==========================
// BUILD TABLE DYNAMICALLY
// ==========================
onValue(windowsRef, (snap) => {

    const data = snap.val();
    if (!data) return;

    const windows = Object.entries(data)
        .sort((a, b) => (a[1].order || 0) - (b[1].order || 0));

    const headerRow = document.getElementById("headerRow");
    const dataRow = document.getElementById("dataRow");

    headerRow.innerHTML = "";
    dataRow.innerHTML = "";

    windows.forEach(([id, win]) => {

        // HEADER
        const th = document.createElement("td");
        th.className = "header-cell";
        th.innerText = win.label;
        headerRow.appendChild(th);

        // VALUE CELL
        const td = document.createElement("td");
        td.className = "queue-cell";
        td.id = id;
        td.innerText = win.queue || 0;
        dataRow.appendChild(td);

        // AUDIO LOGIC
        const val = win.queue || 0;

        if (!firstLoad && last[id] !== val) {

            if (audioUnlocked) {
                beep.currentTime = 0;
                beep.play().catch(() => {});
            }

            if (audioUnlocked && voiceEnabled) {

                speak(
                    win.label + " now serving number " + val
                );
            }
        }

        last[id] = val;
    });

    firstLoad = false;
});

</script>

</body>
</html>
