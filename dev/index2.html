
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue Display</title>

<style>
html, body {
    height: 100%;
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    overflow: hidden;
}

body {
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1 {
    font-size:5vw;
}

table {
    width:95%;
    table-layout:fixed;
}

.header-cell {
    font-size:2.5vw;
    border-bottom:3px solid red;
    text-align:center;
}

.queue-cell {
    font-size:16vw;
    text-align:center;
    font-family:Impact;
}
</style>
</head>

<body>

<h1>NOW SERVING</h1>

<table>
<tr>
    <td class="header-cell">WINDOW 3</td>
    <td class="header-cell">WINDOW 4</td>
    <td class="header-cell">WINDOW 5</td>
    <td class="header-cell">WINDOW 6</td>
</tr>

<tr>
    <td class="queue-cell" id="win3">0</td>
    <td class="queue-cell" id="win4">0</td>
    <td class="queue-cell" id="win5">0</td>
    <td class="queue-cell" id="win6">0</td>
</tr>
</table>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBwV2E3x88_DGPu8JV4Za6aZMZrWIOt23o",
    authDomain: "panelco-i-queue-system.firebaseapp.com",
    databaseURL: "https://panelco-i-queue-system-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "panelco-i-queue-system",
    storageBucket: "panelco-i-queue-system.firebasestorage.app",
    messagingSenderId: "1075037996413",
    appId: "1:1075037996413:web:98dc8a28777d5c7b1a7814"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const queueRef = ref(db, "queues");
const voiceRef = ref(db, "settings/voiceEnabled");

let voiceEnabled = false;
let audioUnlocked = false;
let firstLoad = true;
let last = {};

const beep = new Audio("beep.mp3");


// ==========================
// ENABLE AUDIO BUTTON
// ==========================

document.getElementById("enableAudioBtn")
.addEventListener("click", async () => {

    try {

        await beep.play();

        beep.pause();
        beep.currentTime = 0;

        speechSynthesis.speak(
            new SpeechSynthesisUtterance("Audio enabled")
        );

        audioUnlocked = true;

        document.getElementById("enableAudioBtn")
        .style.display = "none";

        console.log("Audio unlocked");

    }
    catch(err) {

        console.error(err);

        alert(
            "Browser still blocked audio. Try clicking again."
        );
    }

});


// ==========================
// VOICE TOGGLE
// ==========================

onValue(voiceRef, (snap) => {

    voiceEnabled = snap.val() === true;

    console.log(
        "Voice Enabled:",
        voiceEnabled
    );

});


// ==========================
// SPEAK FUNCTION
// ==========================

function speak(text) {

    if(!audioUnlocked) return;

    speechSynthesis.cancel();

    const msg =
        new SpeechSynthesisUtterance(text);

    msg.rate = 1;

    speechSynthesis.speak(msg);

}


// ==========================
// UPDATE DISPLAY
// ==========================

function update(id, val) {

    val = val ?? 0;

    document.getElementById(id)
        .innerText = val;

    if(firstLoad) {

        last[id] = val;
        return;
    }

    if(last[id] !== val) {

        console.log(
            "Changed:",
            id,
            val
        );

        if(audioUnlocked) {

            beep.currentTime = 0;

            beep.play()
            .catch(err =>
                console.log(err)
            );

        }

        if(
            audioUnlocked &&
            voiceEnabled
        ) {

            const windowNo =
                id.replace("win","");

            speak(
                "Window " +
                windowNo +
                " now serving number " +
                val
            );

        }

        last[id] = val;
    }

}


// ==========================
// FIREBASE LISTENER
// ==========================

onValue(queueRef, (snap) => {

    const d = snap.val();

    console.log(
        "Firebase:",
        d
    );

    if(!d) return;

    update("win3", d.w3);
    update("win4", d.w4);
    update("win5", d.w5);
    update("win6", d.w6);

    firstLoad = false;

},
(err) => {

    console.error(
        "Firebase Error:",
        err
    );

});

</script>
<button id="enableAudioBtn"
style="
position:absolute;
top:20px;
right:20px;
font-size:20px;
padding:15px;
background:green;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
z-index:9999;">
ENABLE AUDIO
</button>
</body>
</html>
