<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A Admin</title>
</head>

<body>

    <h2>Q&A Admin</h2>

    <div>
        <strong>Current Question:</strong>
        <div id="questionText">Loading...</div>
    </div>

    <br>

    <div>
        <strong>Status:</strong>
        <span id="status">Loading...</span>
    </div>

    <br>

    <button id="openBtn">OPEN QUESTION</button>
    <button id="closeBtn">CLOSE QUESTION</button>

    <hr>

    <div id="message"></div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            getDoc,
            updateDoc
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        // Firebase configuration

        const firebaseConfig = {
            apiKey: "AIzaSyAJ7zwv7xadG72VEW1JI_dJFuZfKjM9ESc",
            authDomain: "panelcoiqa.firebaseapp.com",
            projectId: "panelcoiqa",
            storageBucket: "panelcoiqa.firebasestorage.app",
            messagingSenderId: "562964190698",
            appId: "1:562964190698:web:bac52f098b5b3a5ada8e93"
        };


        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);


        const questionText = document.getElementById("questionText");
        const statusText = document.getElementById("status");
        const message = document.getElementById("message");


        let currentQuestionId = null;


        // Load current game information

        async function loadCurrentQuestion() {

            try {

                const gameRef = doc(db, "game", "current");
                const gameSnap = await getDoc(gameRef);

                if (!gameSnap.exists()) {
                    message.textContent = "game/current document does not exist.";
                    return;
                }

                const gameData = gameSnap.data();

                currentQuestionId = gameData.questionId;

                statusText.textContent = gameData.status;


                // Load the actual question

                const questionRef = doc(
                    db,
                    "questions",
                    currentQuestionId
                );

                const questionSnap = await getDoc(questionRef);

                if (!questionSnap.exists()) {
                    questionText.textContent =
                        "Question " + currentQuestionId + " does not exist.";

                    return;
                }

                const questionData = questionSnap.data();

                questionText.textContent = questionData.question;


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Error loading question: " + error.message;
            }
        }


        // OPEN QUESTION

        document.getElementById("openBtn").addEventListener(
            "click",
            async () => {

                if (!currentQuestionId) {
                    message.textContent = "No current question.";
                    return;
                }

                try {

                    const gameRef = doc(db, "game", "current");

                    await updateDoc(gameRef, {
                        status: "open"
                    });

                    statusText.textContent = "open";

                    message.textContent =
                        "Question is now OPEN.";

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Error opening question: " + error.message;
                }
            }
        );


        // CLOSE QUESTION

        document.getElementById("closeBtn").addEventListener(
            "click",
            async () => {

                if (!currentQuestionId) {
                    message.textContent = "No current question.";
                    return;
                }

                try {

                    const gameRef = doc(db, "game", "current");

                    await updateDoc(gameRef, {
                        status: "closed"
                    });

                    statusText.textContent = "closed";

                    message.textContent =
                        "Question is now CLOSED.";

                } catch (error) {

                    console.error(error);

                    message.textContent =
                        "Error closing question: " + error.message;
                }
            }
        );


        // Initial load

        loadCurrentQuestion();

    </script>

</body>
</html>
