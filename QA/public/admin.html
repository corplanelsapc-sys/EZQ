<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Q&A Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f5f7;
            color: #202a35;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .page {
            width: min(1100px, 94vw);
            margin: 0 auto;
            padding: 28px 0 50px;
        }

        /* ----------------------------------------
           HEADER
        ---------------------------------------- */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid #d7dde3;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #1d2d3d;
        }

        .header-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #687582;
        }

        /* ----------------------------------------
           SECTIONS
        ---------------------------------------- */

        .section {
            margin-top: 24px;
            padding: 22px;
            background: #ffffff;
            border: 1px solid #dce2e7;
            border-radius: 7px;
            box-shadow: 0 2px 8px rgba(20, 35, 50, 0.04);
        }

        .section-title {
            margin: 0 0 18px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #53616d;
            text-transform: uppercase;
        }

        /* ----------------------------------------
           CURRENT QUESTION
        ---------------------------------------- */

        .current-question {
            padding: 18px 20px;
            background: #f7f9fa;
            border: 1px solid #dce2e7;
            border-left: 5px solid #1769aa;
            border-radius: 6px;
        }

        #currentQuestion {
            font-size: 25px;
            line-height: 1.35;
            font-weight: 650;
            color: #172331;
            white-space: pre-line;
        }

        #currentStatus {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #1769aa;
        }

        /* ----------------------------------------
           BUTTONS
        ---------------------------------------- */

        button {
            padding: 9px 15px;
            border: 1px solid #cbd3da;
            border-radius: 5px;
            background: #ffffff;
            color: #263541;
            font-family: inherit;
            font-size: 13px;
            font-weight: 650;
            letter-spacing: 0.04em;
            cursor: pointer;
        }

        button:hover {
            background: #f1f4f6;
        }

        button:active {
            transform: translateY(1px);
        }

        .navigation {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .navigation button {
            min-width: 100px;
        }

        .primary-actions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 9px;
            margin-top: 12px;
        }

        .primary-actions button {
            min-height: 44px;
        }

        #selectButton {
            border-color: #1769aa;
            color: #1769aa;
        }

        #openButton {
            border-color: #18794e;
            background: #18794e;
            color: #ffffff;
        }

        #openButton:hover {
            background: #146640;
        }

        #closeButton {
            border-color: #687582;
            color: #53616d;
        }

        #playedButton {
            border-color: #53616d;
            color: #3f4d58;
        }

        /* ----------------------------------------
           TIMER SETTINGS
        ---------------------------------------- */

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 18px;
            align-items: end;
        }

        .setting {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting label {
            font-size: 13px;
            font-weight: 650;
            color: #53616d;
        }

        .checkbox-label {
            display: flex !important;
            flex-direction: row !important;
            align-items: center;
            gap: 9px;
            height: 40px;
        }

        input[type="checkbox"] {
            width: 17px;
            height: 17px;
        }

        input[type="number"],
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 11px;
            border: 1px solid #cbd3da;
            border-radius: 5px;
            background: #ffffff;
            color: #202a35;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #1769aa;
            box-shadow: 0 0 0 2px rgba(23, 105, 170, 0.10);
        }

        /* ----------------------------------------
           QUESTION BANK
        ---------------------------------------- */

        #questionBank {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .question-row {
            display: grid;
            grid-template-columns: auto auto auto 1fr auto;
            align-items: center;
            gap: 7px;
            padding: 11px 12px;
            border: 1px solid #e0e5e9;
            border-radius: 5px;
            background: #fafbfc;
        }

        .question-row:hover {
            background: #f5f7f8;
        }

        .question-row.current {
            border-left: 4px solid #1769aa;
            background: #f1f6fa;
        }

        .question-id {
            min-width: 45px;
            font-size: 12px;
            font-weight: 700;
            color: #1769aa;
        }

        .question-text {
            min-width: 0;
            font-size: 14px;
            color: #344450;
            line-height: 1.35;
        }

        .question-state {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }

        .played {
            color: #18794e;
        }

        .unplayed {
            color: #8a6416;
        }

        .question-row button {
            padding: 7px 10px;
            font-size: 11px;
        }

        .delete-button {
            color: #a23b3b;
            border-color: #d8baba;
        }

        .delete-button:hover {
            background: #fbf2f2;
        }

        /* ----------------------------------------
           ADD QUESTION
        ---------------------------------------- */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 650;
            color: #53616d;
        }

        #newQuestion {
            min-height: 100px;
            resize: vertical;
        }

        .add-button {
            margin-top: 2px;
            border-color: #1769aa;
            background: #1769aa;
            color: #ffffff;
        }

        .add-button:hover {
            background: #12588f;
        }

        /* ----------------------------------------
           RESET
        ---------------------------------------- */

        .reset-section {
            border-color: #e1caca;
            background: #fffafa;
        }

        .reset-section .section-title {
            color: #963c3c;
        }

        .reset-description {
            margin: 0 0 16px;
            max-width: 800px;
            color: #687582;
            font-size: 14px;
            line-height: 1.5;
        }

        #resetButton {
            border-color: #a23b3b;
            background: #ffffff;
            color: #a23b3b;
            font-weight: 700;
        }

        #resetButton:hover {
            background: #a23b3b;
            color: #ffffff;
        }

        /* ----------------------------------------
           MESSAGE
        ---------------------------------------- */

        #message {
            margin-top: 18px;
            padding: 12px 14px;
            min-height: 20px;
            color: #1769aa;
            font-size: 13px;
            font-weight: 650;
        }

        /* ----------------------------------------
           MOBILE
        ---------------------------------------- */

        @media (max-width: 800px) {

            .primary-actions {
                grid-template-columns: 1fr 1fr;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .question-row {
                grid-template-columns: auto auto auto;
            }

            .question-text {
                grid-column: 1 / -1;
                grid-row: 2;
            }

            .question-state {
                grid-column: 1 / -1;
                grid-row: 3;
            }
        }

        @media (max-width: 560px) {

            .page {
                width: 94vw;
                padding-top: 20px;
            }

            .header-label {
                display: none;
            }

            .section {
                padding: 17px;
            }

            .primary-actions {
                grid-template-columns: 1fr;
            }

            .navigation {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .navigation button {
                width: 100%;
            }

            .question-row {
                grid-template-columns: 1fr 1fr;
            }

            .question-row button {
                width: 100%;
            }

            .question-text {
                grid-column: 1 / -1;
                grid-row: 2;
            }

            .question-state {
                grid-column: 1 / -1;
                grid-row: 3;
            }

            #currentQuestion {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <header class="header">
        <div class="brand">PANELCO I</div>
        <div class="header-label">Q&amp;A ADMIN</div>
    </header>


    <!-- CURRENT QUESTION -->

    <section class="section">

        <h2 class="section-title">
            Current Question
        </h2>

        <div class="current-question">

            <div id="currentQuestion">
                No question selected.
            </div>

            <div id="currentStatus">
                Status: CLOSED
            </div>

        </div>


        <div class="navigation">

            <button id="previousButton">
                PREVIOUS
            </button>

            <button id="nextButton">
                NEXT
            </button>

        </div>


        <div class="primary-actions">

            <button id="selectButton">
                SELECT QUESTION
            </button>

            <button id="openButton">
                OPEN QUESTION
            </button>

            <button id="closeButton">
                CLOSE QUESTION
            </button>

            <button id="playedButton">
                MARK PLAYED
            </button>

        </div>

    </section>


    <!-- TIMER SETTINGS -->

    <section class="section">

        <h2 class="section-title">
            Timer Settings
        </h2>

        <div class="settings-grid">

            <div class="setting">

                <label class="checkbox-label">
                    <input
                        type="checkbox"
                        id="timerEnabled"
                    >
                    Enable Answer Timer
                </label>

            </div>


            <div class="setting">

                <label for="answerSeconds">
                    Answer Time (seconds)
                </label>

                <input
                    type="number"
                    id="answerSeconds"
                    value="15"
                    min="1"
                    max="300"
                >

            </div>

        </div>

    </section>


    <!-- QUESTION BANK -->

    <section class="section">

        <h2 class="section-title">
            Question Bank
        </h2>

        <div id="questionBank">
            Loading...
        </div>

    </section>


    <!-- ADD QUESTION -->

    <section class="section">

        <h2 class="section-title">
            Add Question
        </h2>

        <div class="form-group">

            <label for="newQuestion">
                Question
            </label>

            <textarea
                id="newQuestion"
                rows="4"
            ></textarea>

        </div>


        <div class="form-group">

            <label for="newAnswer">
                Answer
            </label>

            <input
                type="text"
                id="newAnswer"
            >

        </div>


        <button
            id="addButton"
            class="add-button"
        >
            ADD QUESTION
        </button>

    </section>


    <!-- RESET -->

    <section class="section reset-section">

        <h2 class="section-title">
            Game Reset
        </h2>

        <p class="reset-description">
            Use this before the actual event to clear all previous
            answers and reset all questions to UNPLAYED.
        </p>

        <button id="resetButton">
            RESET GAME
        </button>

    </section>


    <div id="message"></div>

</div>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        updateDoc,
        deleteDoc,
        collection,
        getDocs,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // --------------------------------------------------
    // FIREBASE
    // --------------------------------------------------

    const firebaseConfig = {
        apiKey: "AIzaSyAJ7zwv7xadG72VEW1JI_dJFuZfKjM9ESc",
        authDomain: "panelcoiqa.firebaseapp.com",
        projectId: "panelcoiqa",
        storageBucket: "panelcoiqa.firebasestorage.app",
        messagingSenderId: "562964190698",
        appId: "1:562964190698:web:bac52f098b5b3a5ada8e93"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    // --------------------------------------------------
    // ELEMENTS
    // --------------------------------------------------

    const currentQuestionElement =
        document.getElementById("currentQuestion");

    const currentStatusElement =
        document.getElementById("currentStatus");

    const questionBankElement =
        document.getElementById("questionBank");

    const timerEnabledElement =
        document.getElementById("timerEnabled");

    const answerSecondsElement =
        document.getElementById("answerSeconds");

    const messageElement =
        document.getElementById("message");


    // --------------------------------------------------
    // REFERENCES
    // --------------------------------------------------

    const gameRef =
        doc(db, "game", "current");

    const settingsRef =
        doc(db, "game", "settings");

    const questionsRef =
        collection(db, "questions");

    const submissionsRef =
        collection(db, "submissions");


    // --------------------------------------------------
    // VARIABLES
    // --------------------------------------------------

    let questions = [];

    let currentIndex = 0;

    let currentQuestionId = null;


    // --------------------------------------------------
    // MESSAGE
    // --------------------------------------------------

    function showMessage(text) {

        messageElement.textContent = text;

    }


    // --------------------------------------------------
    // LOAD TIMER SETTINGS
    // --------------------------------------------------

    async function loadTimerSettings() {

        const snapshot =
            await getDoc(settingsRef);

        if (snapshot.exists()) {

            const data =
                snapshot.data();

            timerEnabledElement.checked =
                data.timerEnabled === true;

            answerSecondsElement.value =
                data.answerSeconds || 15;

        }

    }


    // --------------------------------------------------
    // SAVE TIMER SETTINGS
    // --------------------------------------------------

    async function saveTimerSettings() {

        await setDoc(
            settingsRef,
            {
                timerEnabled:
                    timerEnabledElement.checked,

                answerSeconds:
                    Number(answerSecondsElement.value)
            },
            {
                merge: true
            }
        );

    }


    // --------------------------------------------------
    // LOAD CURRENT GAME
    // --------------------------------------------------

    async function loadCurrentGame() {

        const snapshot =
            await getDoc(gameRef);

        if (!snapshot.exists()) {

            currentQuestionId = null;

            currentQuestionElement.textContent =
                "No question selected.";

            currentStatusElement.textContent =
                "Status: CLOSED";

            return;

        }


        const data =
            snapshot.data();


        currentQuestionId =
            data.questionId || null;


        if (currentQuestionId) {

            const index =
                questions.findIndex(
                    q => q.id === currentQuestionId
                );

            if (index >= 0) {

                currentIndex = index;

            }


            const question =
                questions.find(
                    q => q.id === currentQuestionId
                );


            if (question) {

                currentQuestionElement.textContent =
                    question.id +
                    " — " +
                    question.question;

            }
            else {

                currentQuestionElement.textContent =
                    currentQuestionId;

            }

        }
        else {

            currentQuestionElement.textContent =
                "No question selected.";

        }


        currentStatusElement.textContent =
            "Status: " +
            (data.status || "CLOSED");

    }


    // --------------------------------------------------
    // LOAD QUESTIONS
    // --------------------------------------------------

    async function loadQuestions() {

        const snapshot =
            await getDocs(questionsRef);

        questions = [];

        snapshot.forEach(
            questionDoc => {

                questions.push({
                    id: questionDoc.id,
                    ...questionDoc.data()
                });

            }
        );


        questions.sort(
            (a, b) => {

                const aNum =
                    parseInt(
                        a.id.replace(/\D/g, ""),
                        10
                    ) || 0;

                const bNum =
                    parseInt(
                        b.id.replace(/\D/g, ""),
                        10
                    ) || 0;

                return aNum - bNum;

            }
        );


        renderQuestionBank();

        await loadCurrentGame();

    }


    // --------------------------------------------------
    // RENDER QUESTION BANK
    // --------------------------------------------------

    function renderQuestionBank() {

        questionBankElement.innerHTML = "";


        if (questions.length === 0) {

            questionBankElement.textContent =
                "No questions.";

            return;

        }


        questions.forEach(
            (question, index) => {

                const row =
                    document.createElement("div");

                row.className =
                    "question-row";


                if (
                    question.id ===
                    currentQuestionId
                ) {

                    row.classList.add(
                        "current"
                    );

                }


                const selectButton =
                    document.createElement("button");

                selectButton.textContent =
                    "SELECT";

                selectButton.onclick =
                    () => {

                        currentIndex = index;

                        showSelectedQuestion();

                    };


                const editButton =
                    document.createElement("button");

                editButton.textContent =
                    "EDIT";

                editButton.onclick =
                    () => {

                        editQuestion(question);

                    };


                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent =
                    "DELETE";

                deleteButton.className =
                    "delete-button";

                deleteButton.onclick =
                    () => {

                        deleteQuestion(question);

                    };


                const idElement =
                    document.createElement("div");

                idElement.className =
                    "question-id";

                idElement.textContent =
                    question.id;


                const textElement =
                    document.createElement("div");

                textElement.className =
                    "question-text";

                textElement.textContent =
                    question.question;


                const stateElement =
                    document.createElement("div");

                stateElement.className =
                    "question-state";

                if (question.played) {

                    stateElement.classList.add(
                        "played"
                    );

                    stateElement.textContent =
                        "PLAYED";

                }
                else {

                    stateElement.classList.add(
                        "unplayed"
                    );

                    stateElement.textContent =
                        "UNPLAYED";

                }


                row.appendChild(
                    selectButton
                );

                row.appendChild(
                    editButton
                );

                row.appendChild(
                    deleteButton
                );

                row.appendChild(
                    textElement
                );

                row.appendChild(
                    stateElement
                );


                questionBankElement.appendChild(
                    row
                );

            }
        );

    }


    // --------------------------------------------------
    // SHOW SELECTED QUESTION
    // --------------------------------------------------

    function showSelectedQuestion() {

        if (
            currentIndex < 0 ||
            currentIndex >= questions.length
        ) {

            return;

        }


        const question =
            questions[currentIndex];


        currentQuestionId =
            question.id;


        currentQuestionElement.textContent =
            question.id +
            " — " +
            question.question;


        renderQuestionBank();

    }


    // --------------------------------------------------
    // PREVIOUS
    // --------------------------------------------------

    document
        .getElementById("previousButton")
        .addEventListener(
            "click",
            () => {

                if (questions.length === 0) {
                    return;
                }

                if (currentIndex > 0) {

                    currentIndex--;

                    showSelectedQuestion();

                }

            }
        );


    // --------------------------------------------------
    // NEXT
    // --------------------------------------------------

    document
        .getElementById("nextButton")
        .addEventListener(
            "click",
            () => {

                if (questions.length === 0) {
                    return;
                }

                if (
                    currentIndex <
                    questions.length - 1
                ) {

                    currentIndex++;

                    showSelectedQuestion();

                }

            }
        );


    // --------------------------------------------------
    // SELECT QUESTION
    // --------------------------------------------------

    document
        .getElementById("selectButton")
        .addEventListener(
            "click",
            async () => {

                if (!currentQuestionId) {

                    alert(
                        "Select a question first."
                    );

                    return;

                }


                await setDoc(
                    gameRef,
                    {
                        questionId:
                            currentQuestionId,

                        status:
                            "closed",

                        openedAt:
                            null
                    },
                    {
                        merge: true
                    }
                );


                await loadCurrentGame();

                showMessage(
                    "Question selected."
                );

            }
        );


    // --------------------------------------------------
    // OPEN QUESTION
    // --------------------------------------------------

    document
        .getElementById("openButton")
        .addEventListener(
            "click",
            async () => {

                if (!currentQuestionId) {

                    alert(
                        "Select a question first."
                    );

                    return;

                }


                await saveTimerSettings();


                await setDoc(
                    gameRef,
                    {
                        questionId:
                            currentQuestionId,

                        status:
                            "open",

                        openedAt:
                            serverTimestamp()
                    },
                    {
                        merge: true
                    }
                );


                await loadCurrentGame();

                showMessage(
                    "Question OPEN."
                );

            }
        );


    // --------------------------------------------------
    // CLOSE QUESTION
    // --------------------------------------------------

    document
        .getElementById("closeButton")
        .addEventListener(
            "click",
            async () => {

                await setDoc(
                    gameRef,
                    {
                        status:
                            "closed"
                    },
                    {
                        merge: true
                    }
                );


                await loadCurrentGame();

                showMessage(
                    "Question CLOSED."
                );

            }
        );


    // --------------------------------------------------
    // MARK PLAYED
    // --------------------------------------------------

    document
        .getElementById("playedButton")
        .addEventListener(
            "click",
            async () => {

                if (!currentQuestionId) {

                    alert(
                        "No current question."
                    );

                    return;

                }


                await updateDoc(
                    doc(
                        db,
                        "questions",
                        currentQuestionId
                    ),
                    {
                        played: true
                    }
                );


                await loadQuestions();

                showMessage(
                    "Question marked PLAYED."
                );

            }
        );


    // --------------------------------------------------
    // ADD QUESTION
    // --------------------------------------------------

    document
        .getElementById("addButton")
        .addEventListener(
            "click",
            async () => {

                const question =
                    document
                        .getElementById("newQuestion")
                        .value
                        .trim();

                const answer =
                    document
                        .getElementById("newAnswer")
                        .value
                        .trim();


                if (!question || !answer) {

                    alert(
                        "Enter both question and answer."
                    );

                    return;

                }


                let highestNumber = 0;


                questions.forEach(
                    q => {

                        const number =
                            parseInt(
                                q.id.replace(/\D/g, ""),
                                10
                            ) || 0;

                        if (
                            number >
                            highestNumber
                        ) {

                            highestNumber =
                                number;

                        }

                    }
                );


                const newNumber =
                    highestNumber + 1;


                const newId =
                    "Q" +
                    String(newNumber)
                        .padStart(3, "0");


                await setDoc(
                    doc(
                        db,
                        "questions",
                        newId
                    ),
                    {
                        question:
                            question,

                        answer:
                            answer,

                        played:
                            false
                    }
                );


                document
                    .getElementById("newQuestion")
                    .value = "";

                document
                    .getElementById("newAnswer")
                    .value = "";


                await loadQuestions();

                showMessage(
                    newId +
                    " added."
                );

            }
        );


    // --------------------------------------------------
    // EDIT QUESTION
    // --------------------------------------------------

    async function editQuestion(question) {

        const newQuestion =
            prompt(
                "Edit question:",
                question.question
            );


        if (newQuestion === null) {
            return;
        }


        const newAnswer =
            prompt(
                "Edit answer:",
                question.answer
            );


        if (newAnswer === null) {
            return;
        }


        await updateDoc(
            doc(
                db,
                "questions",
                question.id
            ),
            {
                question:
                    newQuestion.trim(),

                answer:
                    newAnswer.trim()
            }
        );


        await loadQuestions();

        showMessage(
            question.id +
            " updated."
        );

    }


    // --------------------------------------------------
    // DELETE QUESTION
    // --------------------------------------------------

    async function deleteQuestion(question) {

        if (question.played) {

            alert(
                "Played questions cannot be deleted."
            );

            return;

        }


        if (
            question.id ===
            currentQuestionId
        ) {

            alert(
                "The current question cannot be deleted."
            );

            return;

        }


        const confirmed =
            confirm(
                "Delete " +
                question.id +
                "?"
            );


        if (!confirmed) {
            return;
        }


        await deleteDoc(
            doc(
                db,
                "questions",
                question.id
            )
        );


        await loadQuestions();

        showMessage(
            question.id +
            " deleted."
        );

    }


    // --------------------------------------------------
    // RESET GAME
    // --------------------------------------------------

    document
        .getElementById("resetButton")
        .addEventListener(
            "click",
            async () => {

                const confirmed =
                    confirm(
                        "RESET GAME?\n\n" +
                        "This will:\n" +
                        "• Delete ALL recorded submissions\n" +
                        "• Reset ALL questions to UNPLAYED\n" +
                        "• Close the current question\n" +
                        "• Clear the current question\n\n" +
                        "Your questions and timer settings will NOT be deleted.\n\n" +
                        "Continue?"
                    );


                if (!confirmed) {
                    return;
                }


                try {

                    showMessage(
                        "Resetting game..."
                    );


                    // ----------------------------------
                    // DELETE ALL SUBMISSIONS
                    // ----------------------------------

                    const submissionSnapshot =
                        await getDocs(
                            submissionsRef
                        );


                    for (
                        const submissionDoc
                        of submissionSnapshot.docs
                    ) {

                        await deleteDoc(
                            submissionDoc.ref
                        );

                    }


                    // ----------------------------------
                    // RESET ALL QUESTIONS
                    // ----------------------------------

                    const questionSnapshot =
                        await getDocs(
                            questionsRef
                        );


                    for (
                        const questionDoc
                        of questionSnapshot.docs
                    ) {

                        await updateDoc(
                            questionDoc.ref,
                            {
                                played:
                                    false
                            }
                        );

                    }


                    // ----------------------------------
                    // RESET CURRENT GAME
                    // ----------------------------------

                    await setDoc(
                        gameRef,
                        {
                            questionId:
                                null,

                            status:
                                "closed",

                            openedAt:
                                null
                        },
                        {
                            merge: true
                        }
                    );


                    currentQuestionId =
                        null;

                    currentIndex =
                        0;


                    await loadQuestions();

                    showMessage(
                        "GAME RESET COMPLETE."
                    );


                    alert(
                        "GAME RESET COMPLETE.\n\n" +
                        "All submissions were deleted.\n" +
                        "All questions are now UNPLAYED.\n" +
                        "No question is currently open."
                    );

                }
                catch (error) {

                    console.error(
                        error
                    );

                    showMessage(
                        "RESET ERROR: " +
                        error.message
                    );

                    alert(
                        "Reset failed:\n\n" +
                        error.message
                    );

                }

            }
        );


    // --------------------------------------------------
    // INITIAL LOAD
    // --------------------------------------------------

    await loadTimerSettings();

    await loadQuestions();

</script>

</html>
