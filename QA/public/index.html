<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANELCO I Q&A</title>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --ink: #18212b;
        --muted: #697586;
        --line: #dfe4ea;
        --surface: #ffffff;
        --background: #f4f6f8;
        --accent: #174a7e;
        --accent-dark: #10385f;
        --danger: #b42318;
        --success: #16794c;
    }

    body {
        margin: 0;
        background: var(--background);
        color: var(--ink);
        font-family:
            Inter,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;
        min-height: 100vh;
    }

    .page {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 20px;
    }

    /* HEADER */

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 4px 0 16px;
        margin-bottom: 28px;
    }

    .brand {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: .04em;
    }

    .brand span {
        color: var(--accent);
    }

    .event-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: .08em;
        text-transform: uppercase;
    }

    /* TIMER */

    .timer-area {
        text-align: center;
        margin-bottom: 28px;
    }

    #timer {
        font-size: clamp(42px, 12vw, 72px);
        line-height: 1;
        font-weight: 700;
        letter-spacing: -.04em;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
    }

    /* QUESTION */

    .question-area {
        background: var(--surface);
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        padding: 28px 26px;
        margin-bottom: 28px;
        box-shadow: 0 3px 12px rgba(20, 35, 50, .05);
    }

    #question {
        margin: 0;
        font-size: clamp(22px, 5vw, 32px);
        line-height: 1.45;
        font-weight: 600;
        letter-spacing: -.015em;
        white-space: pre-line;
    }

    /* FORM */

    .form-section {
        background: var(--surface);
        border: 1px solid var(--line);
        padding: 24px 26px 26px;
        box-shadow: 0 3px 12px rgba(20, 35, 50, .04);
    }

    .field {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .08em;
        color: var(--muted);
        text-transform: uppercase;
    }

    input {
        width: 100%;
        height: 52px;
        padding: 0 14px;
        border: 1px solid #cbd2da;
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font-size: 17px;
        outline: none;
        transition:
            border-color .15s ease,
            box-shadow .15s ease;
    }

    input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(23, 74, 126, .10);
    }

    button {
        width: 100%;
        height: 54px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: .04em;
        cursor: pointer;
        transition:
            background .15s ease,
            transform .05s ease;
    }

    button:hover {
        background: var(--accent-dark);
    }

    button:active {
        transform: translateY(1px);
    }

    button:disabled {
        background: #aeb7c2;
        cursor: not-allowed;
        transform: none;
    }

    /* STATUS */

    #status {
        margin-top: 18px;
        min-height: 22px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
    }

    /* MOBILE */

    @media (max-width: 600px) {
        .page {
            padding: 16px;
        }

        .header {
            margin-bottom: 22px;
        }

        .question-area {
            padding: 22px 20px;
            margin-bottom: 20px;
        }

        .form-section {
            padding: 20px;
        }

        #question {
            font-size: 23px;
        }

        .timer-area {
            margin-bottom: 22px;
        }
    }

    /* VERY SMALL PHONES */

    @media (max-width: 380px) {
        .page {
            padding: 12px;
        }

        #question {
            font-size: 21px;
        }

        .question-area,
        .form-section {
            padding: 18px;
        }
    }
</style>
</head>

<body>

<div class="page">

    <header class="header">
        <div class="brand">PANELCO <span>I</span></div>
        <div class="event-label">Q&amp;A</div>
    </header>

    <main>

        <section class="timer-area">
            <div id="timer">TIME: --</div>
        </section>

        <section class="question-area">
            <h2 id="question">WAITING FOR QUESTION</h2>
        </section>

        <section class="form-section">

            <div class="field">
                <label for="username">Your Name</label>
                <input
                    type="text"
                    id="username"
                    autocomplete="name"
                    placeholder="Enter your name">
            </div>

            <div class="field">
                <label for="answer">Your Answer</label>
                <input
                    type="text"
                    id="answer"
                    autocomplete="off"
                    placeholder="Enter your answer">
            </div>

            <button id="submitBtn" disabled>
                SUBMIT ANSWER
            </button>

            <div id="status"></div>

        </section>

    </main>
</div>


<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    onSnapshot,
    collection,
    addDoc,
    serverTimestamp
}
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyAJ7zwv7xadG72VEW1JI_dJFuZfKjM9ESc",
    authDomain: "panelcoiqa.firebaseapp.com",
    projectId: "panelcoiqa",
    storageBucket: "panelcoiqa.firebasestorage.app",
    messagingSenderId: "562964190698",
    appId: "1:562964190698:web:bac52f098b5b3a5ada8e93"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const submitSound = new Audio("/beep.mp3");
submitSound.preload = "auto";

const currentRef = doc(db, "game", "current");
const settingsRef = doc(db, "game", "settings");


let currentQuestionID = null;
let currentCorrectAnswer = "";
let questionIsOpen = false;

let timerInterval = null;
let clockOffsetMillis = 0;


/* ---------------------------------------------------------
   CLOCK
--------------------------------------------------------- */

function getCorrectedNow() {
    return Date.now() + clockOffsetMillis;
}


/* ---------------------------------------------------------
   TIMER
--------------------------------------------------------- */

function stopTimer() {

    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}


function disableAnswering() {

    questionIsOpen = false;

    document.getElementById("username").disabled = true;
    document.getElementById("answer").disabled = true;
    document.getElementById("submitBtn").disabled = true;
}


function startTimer(openedAt, answerSeconds) {

    stopTimer();

    const openedMillis = openedAt.toMillis();

    clockOffsetMillis =
        openedMillis - Date.now();

    const deadline =
        openedMillis + (answerSeconds * 1000);


    function updateTimer() {

        const remaining =
            Math.max(0, deadline - getCorrectedNow());

        const seconds =
            Math.ceil(remaining / 1000);

        document.getElementById("timer").textContent =
            "TIME: " + seconds;


        if (remaining <= 0) {

            stopTimer();

            document.getElementById("timer").textContent =
                "TIME: 0 — TIME EXPIRED";

            disableAnswering();
        }
    }


    updateTimer();

    timerInterval =
        setInterval(updateTimer, 200);
}

function playSubmitSound() {
    submitSound.currentTime = 0;

    submitSound.play().catch(error => {
        console.log("Submit sound could not play:", error);
    });
}

/* ---------------------------------------------------------
   CURRENT QUESTION
--------------------------------------------------------- */

onSnapshot(currentRef, async (snapshot) => {

    if (!snapshot.exists()) {
        return;
    }

    const data = snapshot.data();

    currentQuestionID =
        data.questionId || null;

    const status =
        data.status || "closed";


    if (!currentQuestionID || status !== "open") {

        stopTimer();

        questionIsOpen = false;

        document.getElementById("timer").textContent =
            "TIME: --";

        document.getElementById("question").textContent =
            "WAITING FOR QUESTION";

        document.getElementById("status").textContent =
            "Waiting for the next question...";

        disableAnswering();

        return;
    }


    const questionRef =
        doc(db, "questions", currentQuestionID);

    const questionSnapshot =
        await getDoc(questionRef);


    if (!questionSnapshot.exists()) {
        return;
    }


    const questionData =
        questionSnapshot.data();

    currentCorrectAnswer =
        questionData.answer || "";

    document.getElementById("question").textContent =
        questionData.question || "";


    const settingsSnapshot =
        await getDoc(settingsRef);

    let answerSeconds = 30;

    if (settingsSnapshot.exists()) {

        const settings =
            settingsSnapshot.data();

        if (
            typeof settings.answerSeconds === "number"
        ) {
            answerSeconds =
                settings.answerSeconds;
        }
    }


    questionIsOpen = true;

    document.getElementById("answer").value = "";

    document.getElementById("username").disabled = false;
    document.getElementById("answer").disabled = false;
    document.getElementById("submitBtn").disabled = false;

    document.getElementById("status").textContent =
        "Answer now.";

    if (data.openedAt) {
        startTimer(
            data.openedAt,
            answerSeconds
        );
    }

});


/* ---------------------------------------------------------
   SUBMIT
--------------------------------------------------------- */

document.getElementById("submitBtn")
    .addEventListener("click", async () => {

        if (!questionIsOpen) {
            return;
        }


        const username =
            document.getElementById("username")
                .value.trim();

        const answer =
            document.getElementById("answer")
                .value.trim();


        if (!username || !answer) {

            document.getElementById("status")
                .textContent =
                "Please enter your name and answer.";

            return;
        }


        const isCorrect =
            answer.toLowerCase() ===
            currentCorrectAnswer.toLowerCase();


        try {

            await addDoc(
                collection(db, "submissions"),
                {
                    questionId: currentQuestionID,
                    username: username,
                    answer: answer,
                    correct: isCorrect,
                    timestamp: serverTimestamp()
                }
            );


            document.getElementById("status")
                .textContent =
                "Answer submitted. Waiting for results.";

            playSubmitSound();

            document.getElementById("submitBtn").disabled = true;
            document.getElementById("answer").disabled = true;


        }
        catch (error) {

            console.error(error);

            document.getElementById("status")
                .textContent =
                "Unable to submit answer. Please try again.";
        }

    });


/* ---------------------------------------------------------
   ENTER KEY
--------------------------------------------------------- */

document.getElementById("answer")
    .addEventListener("keydown", (event) => {

        if (event.key === "Enter") {

            event.preventDefault();

            document.getElementById("submitBtn")
                .click();
        }

    });

</script>

</body>
</html>
