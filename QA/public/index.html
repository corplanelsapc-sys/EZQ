<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA</title>
</head>

<body>

    <h1>Question & Answer</h1>

    <div id="status">Waiting...</div>

    <h2 id="question">Waiting for question...</h2>

    <div>
        <label for="username">Name:</label>
        <input type="text" id="username" autocomplete="off">
    </div>

    <br>

    <div>
        <label for="answer">Answer:</label>
        <input type="text" id="answer" autocomplete="off">
        <button id="submitBtn" disabled>Submit Answer</button>
    </div>

    <script type="module">

        import { initializeApp } 
            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            getDoc,
            onSnapshot,
            addDoc,
            collection,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        // --------------------------------------------------
        // FIREBASE CONFIG
        // --------------------------------------------------

        const firebaseConfig = {
            apiKey: "AIzaSyAJ7zwv7xadG72VEW1JI_dJFuZfKjM9ESc",
            authDomain: "panelcoiqa.firebaseapp.com",
            projectId: "panelcoiqa",
            storageBucket: "panelcoiqa.firebasestorage.app",
            messagingSenderId: "562964190698",
            appId: "1:562964190698:web:bac52f098b5b3a5ada8e93"
        };


        // --------------------------------------------------
        // INITIALIZE FIREBASE
        // --------------------------------------------------

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);


        // --------------------------------------------------
        // VARIABLES
        // --------------------------------------------------

        let currentQuestionID = null;
        let currentCorrectAnswer = null;
        let questionIsOpen = false;


        // --------------------------------------------------
        // HTML ELEMENTS
        // --------------------------------------------------

        const statusElement = document.getElementById("status");
        const questionElement = document.getElementById("question");
        const usernameElement = document.getElementById("username");
        const answerElement = document.getElementById("answer");
        const submitButton = document.getElementById("submitBtn");


        // --------------------------------------------------
        // WATCH CURRENT GAME
        // --------------------------------------------------

        const gameRef = doc(db, "game", "current");

        onSnapshot(gameRef, async (gameSnapshot) => {

            if (!gameSnapshot.exists()) {

                currentQuestionID = null;
                currentCorrectAnswer = null;
                questionIsOpen = false;

                statusElement.textContent = "No active game.";
                questionElement.textContent = "Waiting for question...";

                submitButton.disabled = true;

                return;
            }


            const gameData = gameSnapshot.data();

            currentQuestionID = gameData.questionId;
            questionIsOpen = gameData.status === "open";


            // --------------------------------------------------
            // LOAD CURRENT QUESTION
            // --------------------------------------------------

            if (!currentQuestionID) {

                currentCorrectAnswer = null;

                statusElement.textContent = "No question selected.";
                questionElement.textContent = "Waiting for question...";

                submitButton.disabled = true;

                return;
            }


            const questionRef = doc(
                db,
                "questions",
                currentQuestionID
            );

            const questionSnapshot = await getDoc(questionRef);


            if (!questionSnapshot.exists()) {

                currentCorrectAnswer = null;

                statusElement.textContent = "Question not found.";
                questionElement.textContent = "";

                submitButton.disabled = true;

                return;
            }


            const questionData = questionSnapshot.data();


            // --------------------------------------------------
            // DISPLAY QUESTION
            // --------------------------------------------------

            questionElement.textContent = questionData.question;

            currentCorrectAnswer =
                String(questionData.answer || "").trim();


            // --------------------------------------------------
            // OPEN / CLOSED STATUS
            // --------------------------------------------------

            if (questionIsOpen) {

                statusElement.textContent = "QUESTION OPEN";

                submitButton.disabled = false;
                answerElement.disabled = false;
                usernameElement.disabled = false;

            } else {

                statusElement.textContent = "WAITING";

                submitButton.disabled = true;
                answerElement.disabled = true;
                usernameElement.disabled = true;
            }

        });


        // --------------------------------------------------
        // SUBMIT ANSWER
        // --------------------------------------------------

        submitButton.addEventListener("click", submitAnswer);


        async function submitAnswer() {

            const username =
                usernameElement.value.trim();

            const answer =
                answerElement.value.trim();


            // --------------------------------------------------
            // VALIDATION
            // --------------------------------------------------

            if (!username) {

                alert("Please enter your name.");

                usernameElement.focus();

                return;
            }


            if (!answer) {

                alert("Please enter your answer.");

                answerElement.focus();

                return;
            }


            if (!currentQuestionID || !questionIsOpen) {

                alert("There is no open question.");

                return;
            }


            // --------------------------------------------------
            // CHECK ANSWER
            // --------------------------------------------------

            const isCorrect =
                answer.toLowerCase() ===
                currentCorrectAnswer.toLowerCase();


            // --------------------------------------------------
            // SAVE EVERY ANSWER
            // --------------------------------------------------

            try {

                await addDoc(
                    collection(db, "submissions"),
                    {
                        questionID: currentQuestionID,
                        username: username,
                        answer: answer,
                        correct: isCorrect,
                        timestamp: serverTimestamp()
                    }
                );


                // --------------------------------------------------
                // SUCCESS
                // --------------------------------------------------

                if (isCorrect) {

                    alert("Correct answer submitted!");

                } else {

                    alert("Answer submitted.");

                }


                // Clear answer box

                answerElement.value = "";

                answerElement.focus();


            } catch (error) {

                console.error(
                    "Submission error:",
                    error
                );

                alert(
                    "Unable to submit answer. Check the console for details."
                );
            }

        }

    </script>

</body>
</html>
