<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Q&A Results</title>
</head>

<body>

    <h1>Q&A RESULTS</h1>

    <div id="status">WAITING FOR QUESTION</div>

    <h2 id="question"></h2>

    <div id="timer">TIME: --</div>

    <hr>

    <div id="answerCount">
        ANSWERS RECEIVED: 0
    </div>

    <br>

    <button id="revealButton" style="display:none;">
        REVEAL ANSWERS
    </button>

    <div id="results"></div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            getDoc,
            onSnapshot,
            collection,
            query,
            orderBy
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


        // --------------------------------------------------
        // FIREBASE
        // --------------------------------------------------

        const firebaseConfig = {
            apiKey: "AIzaSyAJ7zwv7xadG72VEW1JI_dJFuZfKjM9ESc",
            authDomain: "panelcoiqa.firebaseapp.com",
            projectId: "panelcoiqa",
            storageBucket: "panelcoiqa.firebasestorage.app",
            messagingSenderId: "562964190698",
            appId: "1:562964190698:web:bac52f098b5b3a5ada8e93"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);


        // --------------------------------------------------
        // ELEMENTS
        // --------------------------------------------------

        const statusElement = document.getElementById("status");
        const questionElement = document.getElementById("question");
        const timerElement = document.getElementById("timer");
        const answerCountElement = document.getElementById("answerCount");
        const resultsElement = document.getElementById("results");
        const revealButton = document.getElementById("revealButton");


        // --------------------------------------------------
        // VARIABLES
        // --------------------------------------------------

        let currentQuestionID = null;
        let currentStatus = "closed";

        let submissions = [];

        let revealed = false;

        let timerInterval = null;

        let clockOffsetMillis = 0;

        let questionOpenedAt = null;

        let answerSeconds = 0;

        let currentWinner = null;


        // --------------------------------------------------
        // TIMER
        // --------------------------------------------------

        function stopTimer() {

            if (timerInterval !== null) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

        }


        function getCorrectedNow() {

            return Date.now() + clockOffsetMillis;

        }


        function startTimer(openedAt, seconds) {

            stopTimer();

            if (!openedAt || !seconds || seconds <= 0) {
                timerElement.textContent = "TIME: --";
                return;
            }


            const openedMillis = openedAt.toMillis();

            /*
                Use Firestore's server timestamp as our
                reference instead of relying on the
                projector computer's clock.
            */

            clockOffsetMillis = openedMillis - Date.now();

            const deadline = openedMillis + (seconds * 1000);


            function updateTimer() {

                const remainingMillis =
                    deadline - getCorrectedNow();

                const remainingSeconds =
                    Math.max(0, Math.ceil(remainingMillis / 1000));


                timerElement.textContent =
                    "TIME: " + remainingSeconds;


                if (remainingMillis <= 0) {

                    stopTimer();

                    timerElement.textContent =
                        "TIME: 0 — TIME EXPIRED";

                    /*
                        Automatically reveal the results
                        when the countdown reaches zero.
                    */

                    revealAnswers();
                }

            }


            updateTimer();

            timerInterval = setInterval(updateTimer, 200);

        }


        // --------------------------------------------------
        // HIDE RESULTS
        // --------------------------------------------------

        function hideResults() {

            revealed = false;

            currentWinner = null;

            resultsElement.innerHTML = "";

            answerCountElement.textContent =
                "ANSWERS RECEIVED: 0";

            revealButton.style.display = "none";

        }


        // --------------------------------------------------
        // DISPLAY RESULTS
        // --------------------------------------------------

        function displayResults() {

            answerCountElement.textContent =
                "ANSWERS RECEIVED: " + submissions.length;


            if (!revealed) {

                resultsElement.innerHTML = "";

                if (submissions.length > 0) {

                    resultsElement.innerHTML =
                        "<p>Answers are coming in...</p>" +
                        "<p>🏆 WINNER HIDDEN</p>";

                }

                return;
            }


            resultsElement.innerHTML = "";


            if (submissions.length === 0) {

                resultsElement.innerHTML =
                    "<p>NO ANSWERS RECEIVED</p>";

                return;
            }


            // ----------------------------------------------
            // FIND FIRST CORRECT ANSWER
            // ----------------------------------------------

            currentWinner = null;

            for (const submission of submissions) {

                if (submission.correct === true) {

                    currentWinner = submission;
                    break;

                }

            }


            // ----------------------------------------------
            // WINNER
            // ----------------------------------------------

            if (currentWinner) {

                const winnerName =
                    currentWinner.username || "Unknown";

                const winnerElement =
                    document.createElement("h2");

                winnerElement.textContent =
                    "🏆 WINNER: " + winnerName;

                resultsElement.appendChild(winnerElement);

            }
            else {

                const noWinnerElement =
                    document.createElement("h2");

                noWinnerElement.textContent =
                    "NO CORRECT ANSWER";

                resultsElement.appendChild(noWinnerElement);

            }


            // ----------------------------------------------
            // SUBMISSIONS
            // ----------------------------------------------

            const heading =
                document.createElement("h3");

            heading.textContent =
                "ANSWERS";

            resultsElement.appendChild(heading);


            submissions.forEach((submission, index) => {

            const row =
                document.createElement("div");

            const name =
                submission.username || "Unknown";

            const answer =
                submission.answer || "";

            const result =
                submission.correct
                    ? "CORRECT"
                    : "WRONG";


            let timeText = "";

            if (submission.timestamp) {

                const date =
                    submission.timestamp.toDate();

                timeText =
                    date.toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit",
                        hour12: false
                    });

            }
            else {

                timeText = "TIME PENDING";

            }


            if (
                currentWinner &&
                submission === currentWinner
            ) {

                row.textContent =
                    (index + 1) +
                    ". " +
                    name +
                    " — " +
                    answer +
                    " — 🏆 FIRST CORRECT" +
                    " — " +
                    timeText;

            }
            else {

                row.textContent =
                    (index + 1) +
                    ". " +
                    name +
                    " — " +
                    answer +
                    " — " +
                    result +
                    " — " +
                    timeText;

            }


            resultsElement.appendChild(row);

        });

        }


        // --------------------------------------------------
        // REVEAL
        // --------------------------------------------------

        function revealAnswers() {

            revealed = true;

            revealButton.style.display = "none";

            displayResults();

        }


        revealButton.addEventListener(
            "click",
            revealAnswers
        );


        // --------------------------------------------------
        // LOAD SETTINGS
        // --------------------------------------------------

        async function loadSettings() {

            const settingsRef =
                doc(db, "game", "settings");

            const settingsSnap =
                await getDoc(settingsRef);


            if (settingsSnap.exists()) {

                const settings =
                    settingsSnap.data();

                answerSeconds =
                    Number(settings.answerSeconds || 0);

            }
            else {

                answerSeconds = 0;

            }

        }


        // --------------------------------------------------
        // WATCH SUBMISSIONS
        // --------------------------------------------------

        const submissionsQuery =
            query(
                collection(db, "submissions"),
                orderBy("timestamp", "asc")
            );


        onSnapshot(
            submissionsQuery,
            (snapshot) => {

                submissions = [];

                snapshot.forEach((docSnap) => {

                    const data =
                        docSnap.data();


                    /*
                        Support both the current
                        questionId and the older
                        questionID field.
                    */

                    const submissionQuestionId =
                        data.questionId ||
                        data.questionID;


                    if (
                        currentQuestionID &&
                        submissionQuestionId === currentQuestionID
                    ) {

                        submissions.push(data);

                    }

                });


                displayResults();

            }
        );


        // --------------------------------------------------
        // WATCH CURRENT GAME
        // --------------------------------------------------

        const gameRef =
            doc(db, "game", "current");


        onSnapshot(
            gameRef,
            async (gameSnap) => {

                stopTimer();


                if (!gameSnap.exists()) {

                    currentQuestionID = null;

                    currentStatus = "closed";

                    questionElement.textContent = "";

                    statusElement.textContent =
                        "WAITING FOR QUESTION";

                    timerElement.textContent =
                        "TIME: --";

                    hideResults();

                    return;

                }


                const gameData =
                    gameSnap.data();


                const newQuestionID =
                    gameData.questionId || null;

                const newStatus =
                    gameData.status || "closed";


                /*
                    If the question changed,
                    completely reset the results.
                */

                if (
                    newQuestionID !== currentQuestionID
                ) {

                    submissions = [];

                    hideResults();

                }


                currentQuestionID =
                    newQuestionID;

                currentStatus =
                    newStatus;


                // --------------------------------------------------
                // QUESTION CLOSED
                // --------------------------------------------------

                if (
                    !currentQuestionID ||
                    currentStatus !== "open"
                ) {

                    statusElement.textContent =
                        "WAITING FOR QUESTION";

                    questionElement.textContent = "";

                    timerElement.textContent =
                        "TIME: --";

                    hideResults();

                    return;

                }


                // --------------------------------------------------
                // QUESTION OPEN
                // --------------------------------------------------

                statusElement.textContent =
                    "QUESTION OPEN";


                const questionRef =
                    doc(
                        db,
                        "questions",
                        currentQuestionID
                    );


                const questionSnap =
                    await getDoc(questionRef);


                if (questionSnap.exists()) {

                    const questionData =
                        questionSnap.data();

                    questionElement.textContent =
                        questionData.question || "";

                }
                else {

                    questionElement.textContent =
                        "Question not found.";

                }


                // --------------------------------------------------
                // TIMER SETTINGS
                // --------------------------------------------------

                await loadSettings();


                if (
                    gameData.openedAt &&
                    answerSeconds > 0
                ) {

                    startTimer(
                        gameData.openedAt,
                        answerSeconds
                    );

                    /*
                        Allow manual reveal while timer
                        is still running.
                    */

                    revealButton.style.display =
                        "inline-block";

                }
                else {

                    timerElement.textContent =
                        "NO TIMER";

                    revealButton.style.display =
                        "inline-block";

                }


                displayResults();

            }
        );

    </script>

</body>
</html>
